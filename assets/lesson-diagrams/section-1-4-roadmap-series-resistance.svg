<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1090" viewBox="0 0 840 1090" style="max-width:100%" role="img" aria-labelledby="title1-4 desc1-4" data-lesson="1.4" data-origin="original-app-diagram" data-l="0.02" data-k="0.5" data-area="0.5" data-h="10" data-tin="100" data-tfluid="20" data-rcond="0.08" data-rconv="0.2" data-rtot="0.28" data-q="285.7142857142857" data-ts="77.14285714285714" data-drop-cond="22.857142857142854" data-drop-conv="57.14285714285714">
<title id="title1-4">§1.4 この先の見通し：3つの課題と熱抵抗の考え方</title>
<desc id="desc1-4">アプリ独自作成の模式図。本書の残りで解く三つの課題（熱伝導方程式を境界条件のもとで解く、対流熱伝達率hを決める、放射の形態係数または伝達係数を計算する）と、その前に熱交換器設計を扱う構成を示す。例として内面100度を指定した平板壁（厚さ0.020メートル、熱伝導率0.5、面積0.50平方メートル）と外側対流（熱伝達率10、流体20度）の直列抵抗では、伝導抵抗0.080、対流抵抗0.200ケルビン毎ワット、伝熱量約285.7ワット、外面温度約77.14度になる。原著の図版の転載ではない。</desc>
<style>
text{font-family:system-ui,'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:23px}
.bg{fill:#ffffff}.panel{fill:#f4f7fa;stroke:#c2d1dd;stroke-width:2}.ink{fill:#173044}.muted{fill:#43596c}.warm{fill:#a84429}.cool{fill:#146b83}
.wall{fill:#8a97a3;stroke:#43596c;stroke-width:2}.barcond{fill:#d98a16}.barconv{fill:#5396b4}
.circuit{stroke:#43596c;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:20px}.tiny{font-size:19px}.equation{font-size:23px;font-weight:650}
@media(prefers-color-scheme:dark){.bg{fill:#101b26}.panel{fill:#1d2d3d;stroke:#657d91}.ink{fill:#f1f7fb}.muted{fill:#c8d8e5}.warm{fill:#ffb599}.cool{fill:#8fdaef}.wall{fill:#5a6d7d;stroke:#c8d8e5}.barcond{fill:#b97e22}.barconv{fill:#2c6d88}.circuit{stroke:#c8d8e5}}
</style>
<rect class="bg" width="840" height="1090"/>
<text class="title ink" x="31" y="58">§1.4 この先の見通し</text>
<text class="small muted" x="33" y="97">本書が解くべき課題は3つ。道具立てのあと第3章で熱交換器へ</text>
<rect class="panel" x="23" y="119" width="794" height="252" rx="19"/>
<text class="section ink" x="43" y="161">① 本書の3つの課題（§1.4）</text>
<text class="small ink" x="43" y="203">課題1 伝導：熱伝導方程式を適切な境界条件で解く → Part II</text>
<text class="small ink" x="43" y="243">課題2 対流：熱伝達係数 h を決める → Part III</text>
<text class="small ink" x="43" y="283">課題3 放射：形態係数 F または伝達係数 ℱ を計算 → Part IV</text>
<text class="small muted" x="43" y="333">先に第2章で道具立て、第3章で「h が既知なら」の熱交換器設計を示す</text>
<rect class="panel" x="23" y="389" width="794" height="300" rx="19"/>
<text class="section ink" x="43" y="431">② 道具の原型：直列の熱抵抗</text>
<rect class="wall" x="330" y="460" width="60" height="90" rx="3"/>
<text class="small ink" x="120" y="495">内面 100 ℃</text>
<text class="small ink" x="120" y="529">（温度指定）</text>
<text class="small ink" x="430" y="495">壁 L = 0.020 m</text>
<text class="small ink" x="430" y="529">k = 0.50 W/(m·K)</text>
<text class="small cool" x="640" y="495">流体 20 ℃</text>
<text class="small cool" x="640" y="529">h = 10</text>
<path class="circuit" d="M120 610 H300 L330 585 L390 635 L420 610 H560 L590 585 L650 635 L680 610 H760"/>
<text class="small ink" x="345" y="668">R_cond</text>
<text class="small ink" x="605" y="668">R_conv</text>
<rect class="panel" x="23" y="707" width="794" height="262" rx="19"/>
<text class="section ink" x="43" y="749">③ 検算：温度降下の和が全体に戻る</text>
<text class="small ink" x="43" y="791">R_cond = L/(kA) = 0.080 K/W、R_conv = 1/(hA) = 0.200 K/W</text>
<text class="small ink" x="43" y="831">Q = (100 − 20)/(0.080 + 0.200) = 285.7 W</text>
<text class="small ink" x="43" y="871">伝導の降下 22.86 K</text>
<rect class="barcond" id="drop-cond" x="330" y="850" width="137.1" height="20"/>
<text class="small ink" x="43" y="919">対流の降下 57.14 K</text>
<rect class="barconv" id="drop-conv" x="330" y="898" width="342.9" height="20"/>
<text class="small muted" x="43" y="953">外面温度 = 100 − 22.86 = 77.14 ℃（= 20 + 57.14 でも一致）</text>
<text class="tiny muted" x="43" y="1020">A = 0.50 m²、定常・一次元・放射なしの仮想例。h の予測自体は課題2</text>
<text class="tiny muted" x="420" y="1072" text-anchor="middle">アプリ作成の独自模式図｜原著の図版・描画の転載なし</text>
</svg>
