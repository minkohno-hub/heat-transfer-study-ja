<circle id="thin-point" class="mark" cx="170" cy="910" r="7"/>
<circle id="thick-point" class="mark" cx="745" cy="1014" r="7"/>
<text x="153" y="916" text-anchor="end" class="micro ink">9,600</text>
<text x="153" y="1020" text-anchor="end" class="micro ink">4,800</text>
<text x="153" y="1124" text-anchor="end" class="micro ink">0</text>
<text x="170" y="1151" text-anchor="middle" class="micro ink">0.25</text>
<text x="457" y="1151" text-anchor="middle" class="micro ink">0.375</text>
<text x="745" y="1151" text-anchor="middle" class="micro ink">0.50</text>
<text x="458" y="1181" text-anchor="middle" class="micro muted">蒸気膜の仮定厚さ δ_g [mm]</text>
<text x="42" y="1225" class="micro muted">縦軸：伝導熱流束 q″ [W/m²]。測定値ではない。</text>
<text x="42" y="1262" class="small ink">限界：この線は実際の膜沸騰の相関曲線ではない。</text>
<text x="42" y="1298" class="micro muted">蒸気流、蒸発、放射、膜の形状変化、界面連成は除外。</text>
<text x="42" y="1332" class="micro muted">放射を勝手に足して安全限界や総伝熱量を保証しない。</text>
<text x="43" y="1372" class="micro muted">R″ = δ/k の単位は m²·K/W（全抵抗 K/W ではない）。</text>
<text x="430" y="1452" text-anchor="middle" class="micro muted">アプリ独自の教育用作図｜原著図版の転載・トレースなし</text>
</svg>
