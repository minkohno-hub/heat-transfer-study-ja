<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1490" viewBox="0 0 860 1490" role="img" aria-labelledby="film-title film-description" style="max-width:100%" data-origin="original-app-diagram" data-lesson="9.4" data-k-gas="0.030" data-t-wall="180" data-t-saturation="100" data-area="0.10" data-thickness-1="0.0002500" data-thickness-2="0.0005000" data-heat-flux-1="9600.000" data-heat-flux-2="4800.000" data-heat-rate-1="960.000" data-heat-rate-2="480.000" data-resistance-area-1="0.008333333333" data-resistance-area-2="0.016666666667" data-point-count="41" data-model="fixed-stagnant-one-dimensional-conduction-only">
<title id="film-title">§9.4 蒸気膜の厚さと伝導熱抵抗</title>
<desc id="film-description">独自の教育用模式図。高温の壁180℃と飽和温度100℃の間に静止した均一蒸気層を仮定し、蒸気の伝導熱流束が厚さに反比例することを比較する。蒸気の熱伝導率0.030 W毎メートルケルビン、面積0.10平方メートル、温度差80ケルビン。蒸気層厚0.25ミリメートルでは面積当たり抵抗0.008333平方メートルケルビン毎ワット、熱流束9600ワット毎平方メートル、熱移動率960ワット。厚さ0.50ミリメートルなら抵抗は0.016667、熱流束4800ワット毎平方メートル、熱移動率480ワット。下段のグラフは厚さ0.25から0.50ミリメートルに対する逆比例曲線41点で、モデルの計算上の数値であり実験測定ではない。実際の膜沸騰で膜厚が自由に一定となるわけではなく、蒸気流・蒸発・放射・界面連成・形状変化が存在する。この固定膜厚・一次元伝導モデルを総伝熱率や安全限界に使用しない。</desc>
