 .curve{stroke:#1b87ac;stroke-width:4.8;fill:none;stroke-linecap:round}.mark{fill:#a54b7e;stroke:#fff;stroke-width:2}
 .heading{font-size:33px;font-weight:750}.subhead{font-size:27px;font-weight:700}.small{font-size:20px}.micro{font-size:18px}.value{font-size:25px;font-weight:660}
 @media(prefers-color-scheme:dark){.bg{fill:#101c27}.panel{fill:#1d3040;stroke:#648195}.ink{fill:#f0f7fc}.muted{fill:#c1d4e2}.wall{fill:#75452e;stroke:#eeb28d}.vapor{fill:#716644;stroke:#d2be83}.liquid{fill:#32677f;stroke:#9dcfe8}.arrow{stroke:#ffa981}.axis{stroke:#c2deef}.gridline{stroke:#70889b}.curve{stroke:#92ddf8}.mark{fill:#ffb3df;stroke:#1d3040}}
