<rect class="bg" width="860" height="1490"/>
<text x="27" y="56" class="heading ink">§9.4 蒸気膜の熱抵抗と膜厚の関係</text>
<text x="28" y="97" class="small muted">均一・静止した固定厚さの蒸気層だけを考える</text>
<rect class="panel" x="22" y="115" width="816" height="332" rx="17"/>
<text x="42" y="159" class="subhead ink">① 壁から蒸気層を通り、液体側へ熱が流れる</text>
<rect id="wall" class="wall" x="100" y="211" width="110" height="135" rx="4"/>
<rect id="vapor-film" class="vapor" x="210" y="211" width="170" height="135"/>
<rect id="liquid" class="liquid" x="380" y="211" width="340" height="135" rx="4"/>
<path class="arrow" d="M130 279 H460 M448 268 L460 279 L448 290"/>
<text x="103" y="199" class="micro ink">高温の壁</text>
<text x="231" y="199" class="micro ink">蒸気膜</text>
<text x="461" y="199" class="micro ink">液体側</text>
<text x="100" y="384" class="small ink">T_w = 180 ℃</text>
<text x="405" y="384" class="small ink">T_sat = 100 ℃</text>
<text x="44" y="421" class="micro muted">模式図：層幅・矢印は縮尺ではない。壁→液体側が熱の正方向。</text>
<rect class="panel" x="22" y="463" width="816" height="299" rx="17"/>
<text x="42" y="508" class="subhead ink">② 固定膜厚モデルの数値比較</text>
<text x="43" y="549" class="small ink">k_g = 0.030 W/(m·K)、A = 0.10 m²、ΔT = 80 K</text>
<text x="43" y="595" class="small ink">蒸気膜厚 0.25 mm</text>
<text x="42" y="629" class="value ink">q″ = 9,600 W/m²　｜　Q = 960 W</text>
<text x="43" y="676" class="small ink">蒸気膜厚 0.50 mm（2倍）</text>
<text x="42" y="711" class="value ink">q″ = 4,800 W/m²　｜　Q = 480 W</text>
<text x="43" y="746" class="micro muted">面積当たり抵抗 R″_g = δ_g/k_g。膜厚2倍で抵抗2倍。</text>
<rect class="panel" x="22" y="778" width="816" height="610" rx="17"/>
<text x="42" y="821" class="subhead ink">③ モデル内の逆比例：q″ = k_g ΔT / δ_g</text>
<path class="axis" d="M170 900 V1118 H753 M158 915 L170 900 L182 915 M743 1107 L753 1118 L743 1129"/>
<path class="gridline" d="M170 910 H745 M170 1014 H745 M170 1118 H745"/>
