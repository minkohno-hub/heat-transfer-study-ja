<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1280" viewBox="0 0 840 1280" role="img" aria-labelledby="surf-title surf-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="9.7" data-q-max-z="500000" data-roughness-um="8" data-angle-deg="20" data-factor="0.949065966755" data-q-max="474532.983378" data-q-fc="30" data-q-b="50" data-q-i="10" data-q-combined="50" data-q-naive="80" data-model="ramilison-bergles-rohsenow">
<title id="surf-title">§9.7 系の条件：表面粗さ・接触角と強制対流の結合</title>
<desc id="surf-desc">アプリが独自に作図した模式図。大きな平板の限界熱流束は、流体力学理論の予測に対して、表面の rms 粗さと後退接触角で整理した補正係数が掛かる。仮想例（粗さ8マイクロメートル、接触角20度）では係数は約0.949となり、限界熱流束は約4.75かける10の5乗ワット毎平方メートルになる。別条件では、単相強制対流と核沸騰の結合は二乗和の平方根で評価され、30と40の成分から50.0キロワット毎平方メートルとなり、単純加算の80にはならない。</desc>
<style>
text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:22px}
.bg{fill:#fff}.panel{fill:#f4f8fb;stroke:#c2d1de;stroke-width:2}.ink{fill:#1b3247}.muted{fill:#455f70}
.axis{fill:none;stroke:#466176;stroke-width:2}.guide{fill:none;stroke:#b7cbd9;stroke-width:1.3;stroke-dasharray:6 5}
.graph{fill:none;stroke:#1680a3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:20px}.micro{font-size:18px}.eq{font-size:24px;font-weight:650}
.point{fill:#ac542f;stroke:#fff;stroke-width:2}.barA{fill:#57a8c9}.barB{fill:#8bd0e2}.barC{fill:#ac542f}.barD{fill:#d8c9a8}
@media(prefers-color-scheme:dark){.bg{fill:#111b27}.panel{fill:#1e2e3e;stroke:#69869a}.ink{fill:#edf5fc}.muted{fill:#c7d9e6}.axis{stroke:#c0dbea}.guide{stroke:#627c8e}.graph{stroke:#8bdcf4}.point{fill:#ffb38c}.barA{fill:#2b6c8c}.barB{fill:#285d74}.barC{fill:#ffb38c}.barD{fill:#6b5d40}}
</style>
<rect class="bg" width="840" height="1280"/>

<text class="title ink" x="30" y="59">§9.7 表面の粗さと濡れ性が CHF を動かす</text>
<text class="small muted" x="30" y="101">Ramilison らの相関（原書 9.36）：流体力学理論からのずれを表面で説明</text>
<rect class="panel" x="23" y="126" width="794" height="477" rx="18"/>
<text class="section ink" x="43" y="169">① 補正係数 vs 後退接触角 β（粗さ r=8 μm）</text>
<path class="axis" d="M170 690 V826 H660 M649 818 L660 826 L649 834"/>
<path class="guide" d="M170 758.0 H660"/>
<path id="factor-curve" class="graph" d="M 170.000 698.278 L 193.500 705.850 L 217.000 713.255 L 240.500 720.493 L 264.000 727.566 L 287.500 734.477 L 311.000 741.227 L 334.500 747.819 L 358.000 754.253 L 381.500 760.533 L 405.000 766.659 L 428.500 772.634 L 452.000 778.459 L 475.500 784.138 L 499.000 789.670 L 522.500 795.059 L 546.000 800.306 L 569.500 805.413 L 593.000 810.382 L 616.500 815.215 L 640.000 819.914"/>
<circle id="factor-point" class="point" cx="405.000" cy="766.659" r="9"/>
<text class="small ink" x="490" y="745">β=20° で係数 ≈ 0.949</text>
<text x="60" y="700" class="micro ink">1.4</text><text x="60" y="765" class="micro ink">1.0</text><text x="60" y="831" class="micro ink">0.6</text>
<text x="180" y="852" class="micro ink">0°</text><text x="640" y="852" class="micro ink">40°</text>
<text x="797" y="545" text-anchor="end" class="micro muted">適用範囲：2 ≦ r ≦ 12 μm、0 ≦ β ≦ 40°。範囲外へ外挿しない。</text>
<text class="small muted" x="45" y="584">粗さは上げる方向、接触角は下げる方向に働き、倍率は常に1以上とは限らない。</text>
<rect class="panel" x="23" y="621" width="794" height="293" rx="18"/>
<text class="section ink" x="43" y="662">② 強制対流と核沸騰の結合（原書 9.37）［kW/m²］</text>
<rect class="barA" x="200" y="690" width="180.0" height="30"/><text class="small ink" x="92" y="713">単相 q″_FC</text><text class="small ink" x="390.0" y="713">30</text><rect class="barB" x="200" y="740" width="240.0" height="30"/><text class="small ink" x="92" y="763">沸騰増分</text><text class="small ink" x="450.0" y="763">40</text><rect class="barC" x="200" y="790" width="300.0" height="30"/><text class="small ink" x="92" y="813">結合式</text><text class="small ink" x="510.0" y="813">50</text><rect class="barD" x="200" y="840" width="480.0" height="30"/><text class="small ink" x="92" y="863">単純加算</text><text class="small ink" x="210" y="863">80（採用しない）</text>
<text class="micro muted" x="43" y="900">結合式 q″ = [q″_FC² + (q″_B − q″_i)²]^(1/2)。二乗和の平方根であり単純加算ではない。</text>
<rect class="panel" x="23" y="932" width="794" height="291" rx="18"/>
<text class="section ink" x="43" y="973">③ 仮想例の結果</text>
<text class="eq ink" x="43" y="1040">q″_max ≈ 0.949 × 5.00×10^5 ≈ 4.75×10^5 W/m²</text>
<text class="eq ink" x="43" y="1090">結合後の熱流束は 50.0 kW/m²（開始後の適合条件）</text>
<text class="micro muted" x="43" y="1181">サブクール・重力・構造化表面など他の系条件は別々に評価する。係数を掛け合わせない。</text>

<text class="micro muted" x="420" y="1255" text-anchor="middle">アプリ作成の独自模式図｜原著図版の転載・トレースなし</text>
</svg>
