<text class="section ink" x="43" y="1069">④ 平均光路長 L0 = 4V/A（10.58）と Hottel の手順</text>
<text class="small ink" x="43" y="1107">球 D=0.6 m → 0.40 m／無限円筒 D=0.4 m → 0.40 m／平板間隔 0.25 m → 0.50 m</text>
<text class="small ink" x="43" y="1143">例題10.11： paL = 8.11 bar·cm → ε_g = 0.085、α_g = 0.12（図表）</text>
<text class="small ink" x="43" y="1179">Q' = πD[ε_g σT_g⁴ − α_g σT_w⁴] = 27.59 kW/m（本書 約27 kW/m）</text>
