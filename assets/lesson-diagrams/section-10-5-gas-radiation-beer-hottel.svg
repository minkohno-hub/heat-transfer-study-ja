<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1264" viewBox="0 0 840 1264" style="max-width:100%" role="img" aria-labelledby="title10-5 desc10-5" data-lesson="10.5" data-origin="original-app-diagram" data-sigma="5.670374419e-8" data-delta-band="2" data-delta-window="0.02" data-tau-band="0.13533528" data-alpha-band="0.86466472" data-tau-window="0.98019867" data-alpha-window="0.01980133" data-d-sphere="0.6" data-l0-sphere="0.4" data-d-cyl="0.4" data-l0-cyl="0.4" data-gap="0.25" data-l0-plates="0.5" data-pa="0.2" data-pal="8.106" data-eg="0.085" data-ag="0.12" data-tg="1473" data-tw="573" data-q="27591.797">
<title id="title10-5">§10.5 気体放射：Beerの法則と平均光路長</title>
<desc id="desc10-5">アプリ独自作成の模式図。気体は帯状にだけ吸収・放射する。Beerの法則により単色強度は光学的深さで指数減衰し、帯内（光学的深さ2.0）では透過率0.1353、吸収率0.8647、帯外の窓（光学的深さ0.02）では透過率0.9802、吸収率0.0198。平均光路長は体積の4倍を面積で割ったもので、直径0.6メートルの球で0.40メートル、直径0.4メートルの無限円筒で0.40メートル、間隔0.25メートルの平行平板で0.50メートル。例題10.11の条件では放射率0.085、吸収率0.12で壁への正味放射は単位長さ当たり27.59キロワット（本書は約27キロワット）。原著の図版の転載ではない。</desc>
