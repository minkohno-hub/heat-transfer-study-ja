<g class="ptwin"><circle cx="150" cy="470" r="6"/><circle cx="290" cy="471.3" r="6"/><circle cx="430" cy="472.59" r="6"/><circle cx="570" cy="473.87" r="6"/><circle cx="710" cy="475.15" r="6"/></g>
