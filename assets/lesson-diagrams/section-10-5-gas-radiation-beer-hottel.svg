<rect class="bg" width="840" height="1264"/>
<text class="title ink" x="31" y="58">§10.5 気体放射：帯でだけ吸収する</text>
<text class="small muted" x="33" y="97">N2・O2 はほぼ透明。CO2 と H2O が特定の波長帯でのみ相互作用する</text>
<rect class="panel" x="23" y="119" width="794" height="262" rx="19"/>
<text class="section ink" x="43" y="161">① Beerの法則（単色）</text>
<text class="equation ink" x="43" y="205">di_λ = −ρ κ_λ i_λ dx　（10.47）</text>
<text class="equation ink" x="43" y="247">i_λ(L) = i_λ0 · exp(−ρ κ_λ L)　（10.48）</text>
<text class="equation ink" x="43" y="289">τ_λ = exp(−δ)、α_λ = 1 − τ_λ　（10.49）（10.50）</text>
<text class="small ink" x="43" y="327">δ = ρκ_λ L が光学的深さ。非散乱気体は反射しない</text>
<text class="small muted" x="43" y="359">単色では ε_λ = α_λ（10.54）でも、全量では一般に ε_g ≠ α_g</text>
<rect class="panel" x="23" y="399" width="794" height="368" rx="19"/>
