<rect class="panel" x="23" y="932" width="794" height="290" rx="18"/>
<text class="section ink" x="43" y="974">③ 熱流束と累積熱量は違う</text>
<text class="micro ink" x="43" y="1011">η = x/(2√αt) = 0.5 ／ √(αt) = 0.010 m</text>
<text class="eq ink" x="43" y="1051">q_x″(0,100 s) = k(Ts−Ti)/√(παt)</text>
<text class="eq ink" x="43" y="1085">= +6,770 W/m²（内部への +x が正）</text>
<text class="eq ink" x="43" y="1126">E/A = ∫q_x″ dt = 2q_x″(100 s)×100 s</text>
<text class="eq ink" x="43" y="1160">= +1.354 MJ/m²（積分値）</text>
<text class="micro muted" x="43" y="1196">t→0+の流束発散は理想化による。実測の無限大ではない。</text>
<text class="micro muted" x="420" y="1259" text-anchor="middle">独自作図｜有限板・有限h・放射・相変化への流用不可</text>
</svg>
