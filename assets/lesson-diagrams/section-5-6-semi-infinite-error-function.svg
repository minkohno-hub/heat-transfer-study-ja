<text class="title ink" x="29" y="58">§5.6 半無限固体：熱は時間とともに内部へ</text>
<text class="small muted" x="31" y="102">突然高温になった表面から、温度変化が広がる</text>

<rect class="panel" x="23" y="124" width="794" height="257" rx="18"/>
<text class="section ink" x="43" y="166">① 初期20℃の固体：表面を80℃に保持</text>
