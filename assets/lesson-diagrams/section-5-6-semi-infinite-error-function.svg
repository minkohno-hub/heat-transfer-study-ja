<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1280" viewBox="0 0 840 1280" role="img" aria-labelledby="semi-title semi-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="5.6" data-initial-c="20" data-surface-c="80" data-k="2" data-alpha="0.000001000" data-depth-m="0.010" data-eval-time-s="100" data-eta="0.5" data-temperature="48.770007331217" data-flux="6770.275002573076" data-energy-per-area="1354055.000514615094" data-penetration-length="0.010000000" data-profile-points="61">
<title id="semi-title">§5.6 半無限固体の非定常熱伝導：誤差関数解と熱流の時間変化</title>
<desc id="semi-desc">アプリの独自図解。半無限固体x≧0が全域20℃から始まり、t&gt;0に表面x=0を80℃で一定に保持する。熱拡散率は10のマイナス6乗平方メートル毎秒、固体の熱伝導率は2ワット毎メートルケルビン。25秒、100秒、400秒の温度分布を厳密な誤差関数解の61点ずつで描く。時刻が進むほど加熱が深くまで達し、表面温度はいつも80℃で、十分深い場所は20℃に近い。100秒後の深さ10ミリメートルでは温度48.77℃。内部へのプラスx方向の表面熱流束は6770.28ワット毎平方メートル、開始から100秒までに入ったエネルギーは1.35406メガジュール毎平方メートル。時間積分した熱量は同時刻の熱流束に100秒を単純に掛けた値の2倍。瞬時に表面温度を変更する理想境界条件のためt→0+で表面熱流束が数学的に発散するが、現実の無限大の熱流を意味せず積分は有限。有限厚さ、表面熱抵抗、対流境界、放射、相変化などには流用しない。</desc>
