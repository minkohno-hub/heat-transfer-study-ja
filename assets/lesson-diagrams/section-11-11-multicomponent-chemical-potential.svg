<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1520" viewBox="0 0 760 1520" role="img" aria-labelledby="multi-title multi-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="11.11" data-temperature-k="300" data-gas-constant="8.3144626" data-x-i="0.10" data-gamma-1="0.7" data-gamma-2="1" data-gamma-3="1.5" data-ms-diffusivity-m2-s="2.0e-9">
<title id="multi-title">§11.11 多成分・非理想の拡散：駆動力は化学ポテンシャル</title>
<desc id="multi-desc">アプリ独自作成の学習図。多成分系では自分の勾配がなくても流束が出たり、勾配に逆らって動いたりする。化学ポテンシャルの差は300ケルビン、モル分率0.10で、活量係数0.7、1、1.5のときマイナス6633、マイナス5743、マイナス4732ジュール毎モル。濃厚二成分液体ではFickの拡散係数は熱力学因子とMaxwell-Stefan係数の積で、熱力学因子が濃度依存の大半を担う。図は模式図。</desc>
<style>
  .bg{fill:#fff}.panel{fill:#f4f7fb;stroke:#bdcad8;stroke-width:2}.ink{fill:#142b3f}.secondary{fill:#415b6f}.a{fill:#a43f24}.b{fill:#176f77}.solid{fill:#d5eaf4;stroke:#39728c;stroke-width:2}.a-stroke{stroke:#a43f24}.b-stroke{stroke:#176f77}.axis{stroke:#415b6f;stroke-width:2.5}.guide{stroke:#bac8d4;stroke-width:2;stroke-dasharray:6 6}.plot-a{fill:none;stroke:#a43f24;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.plot-b{fill:none;stroke:#176f77;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-a{fill:none;stroke:#a43f24;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-b{fill:none;stroke:#176f77;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-ink{fill:none;stroke:#415b6f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shape{fill:none;stroke:#39728c;stroke-width:3}.marker-a{fill:#a43f24}.marker-b{fill:#176f77}
  text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:24px}.title{font-size:33px;font-weight:700}.heading{font-size:28px;font-weight:700}.small{font-size:21px}.equation{font-size:25px;font-weight:600}
  @media(prefers-color-scheme:dark){.bg{fill:#111b27}.panel{fill:#192a3a;stroke:#5b7891}.ink{fill:#eff6ff}.secondary{fill:#c4d7e4}.a{fill:#ffb494}.b{fill:#8fdfdf}.solid{fill:#23475e;stroke:#8ccde9}.a-stroke{stroke:#ffb494}.b-stroke{stroke:#8fdfdf}.axis{stroke:#c4d7e4}.guide{stroke:#617c91}.plot-a{stroke:#ffb494}.plot-b{stroke:#8fdfdf}.arrow-a{stroke:#ffb494}.arrow-b{stroke:#8fdfdf}.arrow-ink{stroke:#c4d7e4}.shape{stroke:#8ccde9}.marker-a{fill:#ffb494}.marker-b{fill:#8fdfdf}}
</style>
<rect class="bg" width="760" height="1520"/>
<text x="34" y="62" class="title ink">§11.11 多成分・非理想混合物の拡散</text>
<text x="36" y="104" class="small secondary">拡散の真の駆動力は濃度勾配でなく化学ポテンシャル勾配</text>
<rect x="24" y="128" width="712" height="352" rx="18" class="panel"/>
<text x="46" y="173" class="heading ink">Duncan–Toor の実験（1962）：N_2 の3つの振る舞い</text>
<circle cx="130" cy="290" r="52" class="shape"/>
<circle cx="300" cy="290" r="52" class="shape"/>
<path d="M182 290 H248" class="shape"/>
<text x="130" y="282" text-anchor="middle" class="small ink">CO_2</text>
<text x="130" y="316" text-anchor="middle" class="small ink">+ N_2</text>
<text x="300" y="282" text-anchor="middle" class="small ink">H_2</text>
<text x="300" y="316" text-anchor="middle" class="small ink">+ N_2</text>
<text x="215" y="382" text-anchor="middle" class="small secondary">管でつないだ2つの球</text>
<text x="400" y="248" class="small ink">① 勾配ゼロでも流束が出る</text>
<text x="400" y="300" class="small ink">② 勾配に逆らって高濃度側へ動く</text>
<text x="400" y="352" class="small ink">③ 勾配があっても流束はゼロ</text>
<text x="400" y="404" class="small secondary">3成分では流束が交差項で結ばれる</text>
<text x="46" y="440" class="small ink">流束は交差項で結ばれる（式(11.120a)(11.120b)）</text>
<text x="46" y="470" class="small secondary">D_ij は負にもなり、D_ij ≠ D_ji もありうる</text>
<rect x="24" y="500" width="712" height="396" rx="18" class="panel"/>
<text x="46" y="547" class="heading ink">化学ポテンシャル μ_i − μ_i° = R°T ln(γ_i x_i)</text>
<text x="46" y="592" class="small ink">T = 300 K、x_i = 0.10 のとき（式(11.131)(11.132)）</text>
<text x="46" y="648" class="small ink">γ = 0.7</text>
<rect id="bar-mu-07" x="190" y="622" width="411.252" height="30" class="b"/>
<text x="613.3" y="648" class="small ink">-6633 J/mol</text>
<text x="46" y="716" class="small ink">γ = 1（理想）</text>
<rect id="bar-mu-10" x="190" y="690" width="356.092" height="30" class="a"/>
<text x="558.1" y="716" class="small ink">-5743 J/mol</text>
<text x="46" y="784" class="small ink">γ = 1.5</text>
<rect id="bar-mu-15" x="190" y="758" width="293.388" height="30" class="b"/>
<text x="495.4" y="784" class="small ink">-4732 J/mol</text>
<text x="46" y="836" class="small ink">駆動力は −∇μ_i（式(11.133)）。平衡では μ_i が相をまたいでも一様</text>
<text x="46" y="876" class="small secondary">濃度勾配で置き換えられるのは理想・希薄のときだけ</text>
<rect x="24" y="916" width="712" height="446" rx="18" class="panel"/>
<text x="46" y="963" class="heading ink">Maxwell–Stefan 係数と熱力学因子 Γ</text>
<text x="46" y="1012" class="small ink">分圧勾配と化学種間の抗力の釣り合い（式(11.126)–(11.128)）</text>
<text x="46" y="1056" class="small ink">Ð_ij = Ð_ji、独立な式は n − 1 本。二成分理想気体では Ð_12 = D_12</text>
<text x="46" y="1104" class="equation ink">濃厚二成分液体：D_12 = Γ Ð_12（式(11.141)）</text>
<text x="46" y="1148" class="small ink">Ð_12 = 2.0×10^(-9) m²/s のとき D_12 は</text>
<text x="46" y="1202" class="small ink">Γ = 0.5</text>
<rect id="bar-d-g0p5" x="170" y="1176" width="90.000" height="30" class="a"/>
<text x="272.0" y="1202" class="small ink">1.0×10^(-9) m²/s</text>
<text x="46" y="1250" class="small ink">Γ = 1.0</text>
<rect id="bar-d-g1p0" x="170" y="1224" width="180.000" height="30" class="a"/>
<text x="362.0" y="1250" class="small ink">2.0×10^(-9) m²/s</text>
<text x="46" y="1298" class="small ink">Γ = 2.0</text>
<rect id="bar-d-g2p0" x="170" y="1272" width="360.000" height="30" class="a"/>
<text x="542.0" y="1298" class="small ink">4.0×10^(-9) m²/s</text>
<text x="46" y="1348" class="small secondary">Fick の D の濃度依存の大半は Γ が担い、Ð の濃度感度はずっと小さい</text>
<text x="46" y="1386" class="small secondary">希薄極限では Γ → 1 で両者は一致する</text>
<text x="380" y="1500" text-anchor="middle" class="small secondary">アプリ作成の独自図・模式図（原書図版ではない）</text>
</svg>
