<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" style="max-width:100%" role="img" aria-labelledby="title2-1 desc2-1" data-lesson="2.1" data-origin="original-app-diagram" data-l="0.04" data-k="20" data-qgen="80000" data-tw="30" data-tmax="30.8" data-qleft="-1600" data-qright="1600" data-gen-area="3200" data-plot-x0="100" data-plot-x1="740" data-plot-ybase="940" data-plot-yscale="300">
<title id="title2-1">§2.1 熱伝導方程式：検査体積の収支から一般形へ</title>
<desc id="desc2-1">アプリ独自作成の模式図。静止した検査体積へのエネルギー収支とFourierの法則から、一般形の熱伝導方程式（式2.10）と、熱伝導率が一定の場合の形（式2.11）を導く流れを示す。例として両面30度の発熱平板（厚さ0.040メートル、熱伝導率20、体積発熱8万ワット毎立方メートル）では温度分布は放物線となり、最高温度は中央の30.8度、両面の外向き流束は各1600ワット毎平方メートルで、単位面積あたりの全発熱3200と一致する。原著の図版の転載ではない。</desc>
<style>
text{font-family:system-ui,'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:23px}
.bg{fill:#ffffff}.panel{fill:#f4f7fa;stroke:#c2d1dd;stroke-width:2}.ink{fill:#173044}.muted{fill:#43596c}.warm{fill:#a84429}.cool{fill:#146b83}
.cv{fill:#e7eef4;stroke:#43596c;stroke-width:2}.curve{stroke:#a84429;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.axis{stroke:#43596c;stroke-width:2}.arrow{stroke:#a84429;stroke-width:3.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:20px}.tiny{font-size:19px}.equation{font-size:23px;font-weight:650}
@media(prefers-color-scheme:dark){.bg{fill:#101b26}.panel{fill:#1d2d3d;stroke:#657d91}.ink{fill:#f1f7fb}.muted{fill:#c8d8e5}.warm{fill:#ffb599}.cool{fill:#8fdaef}.cv{fill:#24384c;stroke:#c8d8e5}.curve{stroke:#ffb599}.axis{stroke:#c8d8e5}.arrow{stroke:#ffb599}}
</style>
<rect class="bg" width="840" height="1290"/>
<text class="title ink" x="31" y="58">§2.1 熱伝導方程式を保存則から導く</text>
<text class="small muted" x="33" y="97">出発点は Fourier の法則 q = −k∇T（式2.2）と第1法則</text>
<rect class="panel" x="23" y="119" width="794" height="262" rx="19"/>
<text class="section ink" x="43" y="161">① 検査体積の収支 → 一般形</text>
<rect class="cv" x="70" y="200" width="180" height="110" rx="6"/>
<text class="small ink" x="160" y="248" text-anchor="middle">検査体積 R</text>
<text class="small muted" x="160" y="282" text-anchor="middle">体積発熱 q̇ あり</text>
<path class="arrow" d="M258 235 H330 M314 221 L330 235 L314 249"/>
<path class="arrow" d="M258 280 H330 M314 266 L330 280 L314 294"/>
<text class="small ink" x="352" y="243">面からの流出 (−k∇T)·n dS の和（式2.5）</text>
<text class="small ink" x="352" y="283">Gauss の定理（式2.8）で体積分へ</text>
<text class="equation ink" x="43" y="345">∇·(k∇T) + q̇ = ρc ∂T/∂t （2.10）</text>
<rect class="panel" x="23" y="399" width="794" height="216" rx="19"/>
<text class="section ink" x="43" y="441">② 前提と座標形</text>
<text class="small ink" x="43" y="483">k 一定なら ∇²T + q̇/k = (1/α) ∂T/∂t （2.11）、α ≡ k/(ρc)</text>
<text class="small ink" x="43" y="523">適用範囲： 非圧縮性・静止した媒体（流れの効果は §6.3 で追加）</text>
<text class="small ink" x="43" y="563">∇² は座標で形が変わる： 直交（2.12）・円筒（2.13）・球（2.14）</text>
<text class="small muted" x="43" y="599">「k は定数」は無条件の事実ではなく、その都度正当化が要る仮定</text>
<rect class="panel" x="23" y="633" width="794" height="540" rx="19"/>
<text class="section ink" x="43" y="675">③ 例：両面等温の発熱平板（放物線分布）</text>
<line class="axis" x1="100" y1="690" x2="100" y2="940"/>
<line class="axis" x1="100" y1="940" x2="740" y2="940"/>
<path id="temp-parabola" class="curve" d="M100.0,940.0 L116.0,916.6 L132.0,894.4 L148.0,873.4 L164.0,853.6 L180.0,835.0 L196.0,817.6 L212.0,801.4 L228.0,786.4 L244.0,772.6 L260.0,760.0 L276.0,748.6 L292.0,738.4 L308.0,729.4 L324.0,721.6 L340.0,715.0 L356.0,709.6 L372.0,705.4 L388.0,702.4 L404.0,700.6 L420.0,700.0 L436.0,700.6 L452.0,702.4 L468.0,705.4 L484.0,709.6 L500.0,715.0 L516.0,721.6 L532.0,729.4 L548.0,738.4 L564.0,748.6 L580.0,760.0 L596.0,772.6 L612.0,786.4 L628.0,801.4 L644.0,817.6 L660.0,835.0 L676.0,853.6 L692.0,873.4 L708.0,894.4 L724.0,916.6 L740.0,940.0"/>
<text class="small ink" x="420" y="678" text-anchor="middle">T_max = 30.8 ℃（中央）</text>
<text class="small ink" x="100" y="972">x = 0（30 ℃）</text>
<text class="small ink" x="740" y="972" text-anchor="end">x = L（30 ℃）</text>
<text class="small ink" x="43" y="1012">T(x) = 30 + 2000x(0.040 − x) ℃（L = 0.040 m、k = 20 W/(m·K)）</text>
<text class="small ink" x="43" y="1050">符号つき流束 q_x(0) = −1600、q_x(L) = +1600 W/m²（q‴ = 8.0×10⁴ W/m³）</text>
<text class="small ink" x="43" y="1088">検算： 外向き放熱 1600 + 1600 = 全発熱 q‴L = 3200 W/m² ✓</text>
<text class="small muted" x="43" y="1126">中心で勾配ゼロ（対称）。片側の1600だけを発熱全量と誤認しない</text>
<text class="small muted" x="43" y="1158">縦軸は 30.0 ℃ 基準・300 px/K の拡大表示（実寸比ではない）</text>
<text class="tiny muted" x="420" y="1272" text-anchor="middle">アプリ作成の独自模式図｜原著の図版・描画の転載なし</text>
</svg>
