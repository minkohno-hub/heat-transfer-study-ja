<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1200" viewBox="0 0 820 1200" style="max-width:100%" role="img" aria-labelledby="title68 desc68" data-lesson="6.8" data-origin="original-app-diagram" data-uinf="10" data-length="1" data-width="0.2" data-nu="0.000015" data-pr-gas="0.7" data-pr-liquid="7" data-k-fluid="0.026" data-dt="40" data-re-l="666666.666666667" data-nu-avg-gas="1362.66010403661" data-h-avg="35.4291627049519" data-q-total="283.433301639616" data-hx-end="28.3433301639616" data-nux-gas="1090.12808322929" data-nux-liquid="3370.30440714351" data-bar-scale="0.13">
<title id="title68">§6.8 乱流熱伝達：気体と液体で違うPr指数</title>
<desc id="desc68">アプリ独自の図。原書の乱流平板の冪乗式は気体ではPrの0.6乗（6.112）、非金属液体ではPrの0.43乗（6.113）と流体種で指数が異なる。気体の例では平均Nusselt数1362.66、平均熱伝達率35.4292、片面熱流283.433ワット、末端局所熱伝達率28.3433で、平均は末端の4分の5倍。Prの3分の1乗を一律に使う形は原書の2式とは一致しない。</desc>
<style>
 text{font-family:system-ui,'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:24px}
 .bg{fill:#ffffff}.panel{fill:#f3f7fa;stroke:#bfd0dc;stroke-width:2}.ink{fill:#173147}.muted{fill:#456076}
 .accent{fill:#176c94}.accent2{fill:#a5522b}
