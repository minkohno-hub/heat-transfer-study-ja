<rect class="bg" width="820" height="1200"/>
<text class="heading ink" x="32" y="59">§6.8 乱流の熱伝達相関</text>
<text class="small muted" x="33" y="101">前縁から乱流・平滑・等温の近似。底層では分子輸送が残る</text>
<rect class="panel" x="23" y="124" width="774" height="290" rx="19"/>
<text class="section ink" x="44" y="168">① 局所相関は流体種で使い分ける（原書）</text>
<text class="result ink" x="43" y="216">気体：Nu_x ≈ 0.0296 Re_x^0.8 Pr^0.6（6.112）</text>
<text class="result ink" x="43" y="254">非金属液体：Nu_x ≈ 0.032 Re_x^0.8 Pr^0.43（6.113、Pr ≤ 85 で ±15%程度）</text>
<text class="small accent2" x="43" y="296">Pr の指数は 1/3 ではなく流体種で異なる</text>
<text class="small muted" x="43" y="330">Pr^(1/3) を一律に使う形は他系統の式で、原書の2式とは一致しない</text>
<text class="small muted" x="43" y="362">原書の推奨は底層補正つき類似式（6.111）。範囲は概ね Re_x = 5×10^5〜10^7</text>
<text class="small muted" x="43" y="392">乱流Pr Pr_t = ν_t/α_t は分子Prとは別のモデル量（≒0.85 と置く場合もある）</text>
<rect class="panel" x="23" y="432" width="774" height="300" rx="19"/>
<text class="section ink" x="44" y="476">② 例（気体、Pr = 0.7）：平均は末端の 5/4 倍</text>
<text class="result ink" x="43" y="520">Re_L = 6.67×10^5、Nū_L = 0.037 Re_L^0.8 Pr^0.6 ≈ 1362.7</text>
<text class="result ink" x="43" y="558">h̄_L ≈ 35.43 W/(m²·K)、片面 Q̇ ≈ 283.4 W（ΔT = 40 K）</text>
<text class="result ink" x="43" y="596">末端局所 h_x(L) = (4/5)h̄_L ≈ 28.34 W/(m²·K)</text>
<text class="small muted" x="43" y="640">h_x ∝ x^(−1/5) の積分が 5/4 倍を与える。層流の2倍とはしない</text>
<text class="small muted" x="43" y="672">前半が層流の板では §6.9 の履歴を含む積分が必要</text>
<rect class="panel" x="23" y="750" width="774" height="252" rx="19"/>
<text class="section ink" x="44" y="794">③ 同じ Re_x での局所 Nu_x(L) 比較</text>
<text class="small ink" x="43" y="840">気体 Pr = 0.7 → 1090.1</text>
<rect id="bar-nux-gas" class="barA" x="43" y="854" width="141.72" height="30"/>
<text class="small ink" x="43" y="918">非金属液体 Pr = 7 → 3370.3</text>
<rect id="bar-nux-liquid" class="barB" x="43" y="932" width="438.14" height="30"/>
<text class="micro muted" x="43" y="986">流体種とPrが異なる比較であり、同じ流体の優劣ではない</text>
<text class="micro muted" x="410" y="1168" text-anchor="middle">アプリ作成の独自模式図｜非実寸・原著図版の転載なし</text>
</svg>
