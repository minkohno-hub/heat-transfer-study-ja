<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" style="max-width:100%" role="img" aria-labelledby="title73 desc73" data-origin="original-app-diagram" data-lesson="7.3" data-diameter="0.020" data-length="1.0" data-ub="5.0" data-rho="1000" data-mu="0.001" data-cp="4200" data-kf="0.60" data-re="100000" data-pr="7.0" data-f="0.0179920275442123" data-nu-colburn="439.9741720376495" data-nu-db="529.2312611493155" data-nu-mcadams="490.0289455086255" data-nu-gnielinski="599.0662261531631" data-h="17971.9867845949" data-dp="11245.0172151327" data-qv="0.0015707963267948966" data-power="17.6636317362758">
<title id="title73">§7.3 管内乱流：相関の系譜と摩擦・圧力損失</title>
<desc id="desc73">アプリ独自作図。内径0.020メートル、長さ1.0メートル、断面平均速度5.0メートル毎秒、密度1000キログラム毎立方メートル、粘度0.0010パスカル秒、比熱4200ジュール毎キログラムケルビン、流体熱伝導率0.60ワット毎メートルケルビンの仮想条件で、レイノルズ数10万、プラントル数7.0。原書の冪乗形の系譜では、Colburn式ヌセルト数440.0、Dittus–Boelter式529.2、McAdams式490.0、摩擦を使うGnielinski式599.1で、熱伝達率は約1.797×10⁴ワット毎平方メートルケルビン。平滑管の摩擦係数0.01799から摩擦圧力損失11.25キロパスカル、流体動力17.66ワット。係数0.023はColburn式のもので、Dittus–Boelterの0.0243とは異なる。</desc>
<style>
text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:23px}
.bg{fill:#fff}.panel{fill:#f4f7fb;stroke:#bfd0df;stroke-width:2}.ink{fill:#193148}.muted{fill:#476074}
.pow{fill:#287b9e}.gn{fill:#b66837}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:21px}.micro{font-size:18px}.formula{font-size:25px;font-weight:650}
@media(prefers-color-scheme:dark){.bg{fill:#111b26}.panel{fill:#1c2b3b;stroke:#617c91}.ink{fill:#edf6fe}.muted{fill:#c6d8e5}.pow{fill:#3688ac}.gn{fill:#ad6d47}}
</style>
<rect class="bg" width="840" height="1220"/>
<text x="30" y="59" class="title ink">§7.3 管内乱流：相関の系譜と摩擦</text>
<text x="31" y="100" class="small muted">同じ条件（D = 0.020 m、U_b = 5.0 m/s、Re_D = 10⁵、Pr = 7.0）で比べる</text>
<rect class="panel" x="24" y="122" width="792" height="470" rx="18"/>
<text x="44" y="164" class="section ink">① 冪乗形の系譜と Gnielinski 式</text>
<text x="45" y="204" class="small ink">Colburn（式7.39a）：Nu = 0.023 Re^0.8 Pr^(1/3)</text>
<rect id="nu-colburn" class="pow" x="250" y="216" width="352" height="30" rx="3"/>
<text x="614" y="240" class="small ink">440.0</text>
<text x="45" y="296" class="small ink">Dittus–Boelter（式7.39b）：Nu = 0.0243 Re^0.8 Pr^0.4</text>
<rect id="nu-db" class="pow" x="250" y="308" width="423.36" height="30" rx="3"/>
<text x="685.36" y="332" class="small ink">529.2</text>
<text x="45" y="388" class="small ink">McAdams（式7.39c）：Nu = 0.0225 Re^0.8 Pr^0.4</text>
<rect id="nu-mcadams" class="pow" x="250" y="400" width="392" height="30" rx="3"/>
<text x="654" y="424" class="small ink">490.0</text>
<text x="45" y="480" class="small ink">Gnielinski（式7.41）：摩擦係数 f_D を使う形</text>
<rect id="nu-gnielinski" class="gn" x="250" y="492" width="479.28" height="30" rx="3"/>
<text x="741.28" y="516" class="small ink">599.1</text>
<text x="45" y="562" class="micro muted">横軸は Nu_D（0–650）。値の差は丸めではなく相関の違い。</text>
<rect class="panel" x="24" y="610" width="792" height="300" rx="18"/>
<text x="44" y="654" class="section ink">② 摩擦・圧力損失・流体動力</text>
<text x="45" y="698" class="small ink">平滑管 f_D = (0.79 ln Re_D − 1.64)^(−2) = 0.01799（Darcy）</text>
<text x="45" y="734" class="small ink">Δp_f = f_D (L/D)(ρ U_b² / 2) = 11.25 kPa（L/D = 50）</text>
<text x="45" y="770" class="small ink">q_v = U_b π D²/4 = 1.571×10⁻³ m³/s</text>
<text x="45" y="810" class="formula ink">流体動力 P = Δp_f q_v = 17.66 W</text>
<text x="45" y="850" class="micro muted">Darcy 係数は Fanning 係数の4倍。ポンプ入力は効率・局所損失も含むので別。</text>
<text x="45" y="880" class="micro muted">h = Nu_D k_f / D：Gnielinski では約 1.797×10⁴ W/(m²·K)。</text>
<rect class="panel" x="24" y="928" width="792" height="200" rx="18"/>
<text x="44" y="972" class="section ink">③ 係数の帰属と適用条件</text>
<text x="45" y="1016" class="small ink">係数 0.023 は Colburn のもの。0.0243 と出典を混同しない</text>
<text x="45" y="1052" class="small ink">平滑・十分発達、Re_D ≳ 10⁴、Pr ≈ 0.7–160 が冪乗形の代表条件</text>
<text x="45" y="1088" class="small ink">初期の冪乗式の誤差は最大 +25% / −40% 程度（原書 §7.3）</text>
<text x="420" y="1178" text-anchor="middle" class="micro muted">アプリ作成の独自模式図｜原著図版の転載・翻訳なし</text>
</svg>
