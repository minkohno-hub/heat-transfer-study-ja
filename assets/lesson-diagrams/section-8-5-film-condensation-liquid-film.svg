<text class="small ink" x="371" y="327">飽和蒸気から潜熱を放出</text>
<text class="small ink" x="371" y="362">液膜を横切る伝導が支配的</text>
<text class="small ink" x="371" y="425">流下するほど液膜が厚くなる</text>
<text class="small ink" x="371" y="460">同じ温度差なら局所流束は低下</text>
<text class="small muted" x="45" y="584">※膜の描画幅は模式的。実際の長さ・厚さの比は表さない。</text>
