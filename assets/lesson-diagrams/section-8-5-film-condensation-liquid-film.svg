<text class="title ink" x="30" y="59">§8.5 膜状凝縮：液膜が熱抵抗になる</text>
<text class="small muted" x="30" y="101">垂直冷却壁に沿う、理想的な非波状層流液膜</text>
<rect class="panel" x="23" y="126" width="794" height="477" rx="18"/>
<text class="section ink" x="43" y="169">① 蒸気 → 液膜 → 冷却壁へ熱が移る</text>
<text class="small muted" x="45" y="210">壁温 T_w ＜ 飽和温度 T_sat ／ 重力方向 ↓</text>
