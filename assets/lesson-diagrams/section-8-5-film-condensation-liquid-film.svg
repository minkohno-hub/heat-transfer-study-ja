<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1280" viewBox="0 0 840 1280" role="img" aria-labelledby="cond-title cond-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="8.5" data-rho-l="950" data-rho-v="0.6" data-k-l="0.68" data-mu-l="0.0002800" data-h-fg="2.25e+06" data-g="9.81" data-length="0.02" data-width="0.5" data-delta-t="10" data-coefficient="0.943" data-h-average="17242.588353583" data-q="1724.258835358" data-mass-rate="0.000766337260" data-re-film="21.895350290" data-thickness-end-m="0.000052593630" data-model="ideal-laminar-film">
<title id="cond-title">§8.5 垂直冷却面の膜状凝縮：液膜厚さと平均伝熱</title>
<desc id="cond-desc">アプリが独自に作図した模式図。静穏な飽和蒸気が温度の低い垂直面で凝縮すると、非波状層流液膜が重力で下向きに流れ、膜は下流に向かって厚くなる。液膜内の伝導が支配的なら、同じ温度差では局所熱流束は膜厚に反比例する。理想モデルでの膜厚は下降距離の4分の1乗に比例し、横のグラフは正規化された膜厚の形だけを表示する。仮想物性からNusselt型平均熱伝達率は約17.24キロワット毎平方メートルケルビン、放熱率は約1.724キロワット、凝縮量は約7.66かける10のマイナス4乗キログラム毎秒、液膜レイノルズ数は約21.9となる。膜厚の横幅は実寸ではなく、非凝縮性ガス、波立ち、蒸気せん断、物性の変化は含めない。</desc>
