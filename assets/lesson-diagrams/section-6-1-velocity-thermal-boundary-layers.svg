 .velBoundary{stroke:#176c94;stroke-width:4;fill:none;stroke-linejoin:round}.thBoundary{stroke:#a5522b;stroke-width:4;fill:none;stroke-dasharray:12 6;stroke-linejoin:round}
 .heading{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:21px}.micro{font-size:19px}.result{font-size:25px;font-weight:700}
