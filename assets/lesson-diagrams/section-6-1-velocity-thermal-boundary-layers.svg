<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1240" viewBox="0 0 820 1240" style="max-width:100%" role="img" aria-labelledby="title61 desc61" data-lesson="6.1" data-origin="original-app-diagram" data-uinf="2" data-length="0.5" data-nu="0.000015" data-alpha-fluid="0.00002" data-k-fluid="0.025" data-h-avg="20" data-delta-v-end="107" data-delta-t-end="94" data-schematic="true">
<title id="title61">§6.1 平板上の速度境界層と温度境界層、Re・Pr・Nu</title>
<desc id="desc61">アプリ独自の定性的な図。平板上を左から右に流れる流体について、壁で速度がゼロとなり外側で主流速度に近づく速度境界層と、表面温度と主流温度が異なるときに生じる温度境界層を上下二枚の図で別々に示す。描画した境界線の厚さや比は任意の説明用模式図であり、境界層の厚さの数値、速度分布、乱流遷移を物理相関式から予測したものではない。例題の独立計算は代表速度2メートル毎秒、長さ0.5メートル、動粘度1.5掛ける10のマイナス5乗平方メートル毎秒、熱拡散率2.0掛ける10のマイナス5乗平方メートル毎秒、流体熱伝導率0.025ワット毎メートルケルビン、平均熱伝達率20ワット毎平方メートルケルビンからReが約66667、Prが0.75、平均Nuが400となる。Nuの評価に固体の熱伝導率を用いない。</desc>
<style>
