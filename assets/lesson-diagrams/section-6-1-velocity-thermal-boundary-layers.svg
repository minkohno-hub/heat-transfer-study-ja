<text class="small thermal" x="518" y="629">温度境界層 δ_T(x)</text>
<text class="small ink" x="44" y="775">固体表面：T_s</text>
<text class="small muted" x="44" y="811">外側：T∞。境界層厚さの比は流況・物性で変わる</text>

<rect class="panel" x="23" y="864" width="774" height="324" rx="19"/>
<text class="section ink" x="44" y="908">③ 同じ代表長さ L = 0.50 m で比較</text>
<text class="small muted" x="43" y="946">ν = 1.5×10^(-5)、α_f = 2.0×10^(-5) m²/s</text>
<text class="small muted" x="43" y="981">k_f = 0.025 W/(m·K)、h_avg = 20 W/(m²·K)</text>
<text class="result ink" x="43" y="1020">Re_L = U∞ L/ν ≈ 6.67×10^4</text>
<text class="result ink" x="43" y="1058">Pr = ν/α_f = 0.75</text>
<text class="result ink" x="43" y="1096">Nu_avg,L = h_avg L/k_f = 400</text>
<text class="micro muted" x="43" y="1134">Nuには流体のk_fを使用。Nuは無次元。</text>
<text class="micro muted" x="43" y="1165">このRe値だけで遷移・乱流を断定しない。</text>
<text class="micro muted" x="410" y="1226" text-anchor="middle">アプリ作成の独自模式図｜非実寸・原著図版の転載なし</text>
