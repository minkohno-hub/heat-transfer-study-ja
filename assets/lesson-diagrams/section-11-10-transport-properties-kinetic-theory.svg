<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1560" viewBox="0 0 760 1560" role="img" aria-labelledby="props-title props-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="11.10" data-sigma-a-angstrom="3.711" data-sigma-b-angstrom="2.899" data-eps-a-k="78.6" data-eps-b-k="40.0" data-omega-d="0.8410" data-temperature-k="282" data-pressure-atm="1" data-m-a-kg-kmol="28.96" data-m-b-kg-kmol="2.016" data-d-experimental-m2-s="0.0000658" data-k-boltzmann="1.380649e-23" data-radius-a-m="2.0e-10">
<title id="props-title">§11.10 混合物の輸送物性：拡散係数を分子から見積もる</title>
<desc id="props-desc">アプリ独自作成の学習図。Lennard-Jonesポテンシャルは距離シグマでゼロ、2の6分の1乗シグマで井戸の深さイプシロンの最小になる。水素と空気の例題11.16では結合則からシグマ3.305オングストローム、イプシロン56.1ケルビン、衝突積分0.8410で拡散係数は6.98×10のマイナス5乗となり実測6.58×10のマイナス5乗より約6パーセント高い。液体ではSutherland-Einstein式が拡散係数と粘度の積を分子の大きさで与える。図は模式図。</desc>
<style>
  .bg{fill:#fff}.panel{fill:#f4f7fb;stroke:#bdcad8;stroke-width:2}.ink{fill:#142b3f}.secondary{fill:#415b6f}.a{fill:#a43f24}.b{fill:#176f77}.solid{fill:#d5eaf4;stroke:#39728c;stroke-width:2}.a-stroke{stroke:#a43f24}.b-stroke{stroke:#176f77}.axis{stroke:#415b6f;stroke-width:2.5}.guide{stroke:#bac8d4;stroke-width:2;stroke-dasharray:6 6}.plot-a{fill:none;stroke:#a43f24;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.plot-b{fill:none;stroke:#176f77;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-a{fill:none;stroke:#a43f24;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-b{fill:none;stroke:#176f77;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-ink{fill:none;stroke:#415b6f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shape{fill:none;stroke:#39728c;stroke-width:3}.marker-a{fill:#a43f24}.marker-b{fill:#176f77}
  text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:24px}.title{font-size:33px;font-weight:700}.heading{font-size:28px;font-weight:700}.small{font-size:21px}.equation{font-size:25px;font-weight:600}
  @media(prefers-color-scheme:dark){.bg{fill:#111b27}.panel{fill:#192a3a;stroke:#5b7891}.ink{fill:#eff6ff}.secondary{fill:#c4d7e4}.a{fill:#ffb494}.b{fill:#8fdfdf}.solid{fill:#23475e;stroke:#8ccde9}.a-stroke{stroke:#ffb494}.b-stroke{stroke:#8fdfdf}.axis{stroke:#c4d7e4}.guide{stroke:#617c91}.plot-a{stroke:#ffb494}.plot-b{stroke:#8fdfdf}.arrow-a{stroke:#ffb494}.arrow-b{stroke:#8fdfdf}.arrow-ink{stroke:#c4d7e4}.shape{stroke:#8ccde9}.marker-a{fill:#ffb494}.marker-b{fill:#8fdfdf}}
</style>
<rect class="bg" width="760" height="1560"/>
<text x="34" y="62" class="title ink">§11.10 混合物の輸送物性</text>
<text x="36" y="104" class="small secondary">Chapman–Enskog 理論：分子間力のパラメータから D を見積もる</text>
<rect x="24" y="128" width="712" height="452" rx="18" class="panel"/>
<text x="46" y="173" class="heading ink">Lennard-Jones ポテンシャル φ(r)</text>
<path d="M124 196 V500 H686" class="axis" fill="none"/>
<path d="M130 390.0 H680" class="guide"/>
<path d="M130 490.0 H680" class="guide"/>
<path d="M176.3 490.0 V330.0" class="guide"/>
<polyline id="lj-curve-11-10" points="130.000,193.903 143.415,390.000 156.829,465.751 170.244,488.337 183.659,488.168 197.073,479.097 210.488,467.370 223.902,455.702 237.317,445.162 250.732,436.069 264.146,428.407 277.561,422.034 290.976,416.765 304.390,412.421 317.805,408.840 331.220,405.885 344.634,403.441 358.049,401.415 371.463,399.729 384.878,398.322 398.293,397.143 411.707,396.152 425.122,395.317 438.537,394.609 451.951,394.009 465.366,393.497 478.780,393.059 492.195,392.684 505.610,392.361 519.024,392.082 532.439,391.841 545.854,391.632 559.268,391.450 572.683,391.291 586.098,391.152 599.512,391.030 612.927,390.923 626.341,390.828 639.756,390.745 653.171,390.671 666.585,390.606 680.000,390.548" class="plot-a"/>
<circle id="marker-lj-min" cx="176.270" cy="490.000" r="7" class="marker-a"/>
<circle id="marker-lj-zero" cx="143.415" cy="390.000" r="7" class="marker-b"/>
<text x="66" y="397" class="small ink">0</text>
<text x="52" y="497" class="small ink">−ε</text>
<text x="52" y="247" class="small ink">1.5ε</text>
<text x="46" y="360" class="small secondary">φ/ε</text>
<text x="135" y="530" class="small ink">σ</text>
<text x="186" y="530" class="small ink">2^(1/6) σ</text>
<text x="664" y="530" class="small ink">3σ</text>
<text x="400" y="530" text-anchor="middle" class="small secondary">分子間距離 r →</text>
<text x="291" y="445" class="small ink">井戸の深さ ε</text>
<text x="46" y="566" class="small secondary">φ = 4ε[(σ/r)^12 − (σ/r)^6]、σ・ε は出典のペアのまま使う</text>
<rect x="24" y="600" width="712" height="396" rx="18" class="panel"/>
<text x="46" y="647" class="heading ink">例題11.16：水素–空気の D_AB（282 K、1 atm）</text>
<text x="46" y="696" class="small ink">σ_AB = (3.711 + 2.899)/2 = 3.305 Å（式(11.106)）</text>
<text x="46" y="738" class="small ink">ε_AB/k_B = √(78.6 × 40.0) = 56.1 K（式(11.107)）</text>
<text x="46" y="780" class="small ink">k_B T/ε_AB = 5.027 → Ω_D = 0.8410（表11.4）</text>
<text x="46" y="822" class="equation ink">D_AB = 6.98×10^(-5) m²/s（式(11.108)）</text>
<rect id="bar-d-pred" x="150" y="850" width="488.446" height="30" class="a"/>
<text x="46" y="875" class="small ink">予測</text>
<text x="650.4" y="875" class="small ink">6.98</text>
<rect id="bar-d-exp" x="150" y="896" width="460.600" height="30" class="b"/>
<text x="46" y="921" class="small ink">実測</text>
<text x="622.6" y="921" class="small ink">6.58</text>
<text x="46" y="968" class="small secondary">単位は 10^(-5) m²/s。予測は実測より約6%高い。D は圧力に反比例する</text>
<rect x="24" y="1016" width="712" height="386" rx="18" class="panel"/>
<text x="46" y="1063" class="heading ink">液体：Sutherland–Einstein 式（式(11.114)）</text>
<text x="46" y="1112" class="small ink">D μ_B/T は主に溶質の大きさ R_A で決まる</text>
<rect id="bar-se-noslip" x="170" y="1140" width="280.000" height="30" class="b"/>
<text x="46" y="1165" class="small ink">無滑り</text>
<text x="462.0" y="1165" class="small ink">k_B/(6πR_A)</text>
<rect id="bar-se-slip" x="170" y="1186" width="420.000" height="30" class="a"/>
<text x="46" y="1211" class="small ink">完全滑り</text>
<text x="602.0" y="1211" class="small ink">k_B/(4πR_A)</text>
<text x="46" y="1258" class="small ink">R_A = 0.20 nm では 3.66×10^(-15) と 5.49×10^(-15) kg·m/(K·s²)</text>
<text x="46" y="1302" class="small ink">両極限の比は 1.5。希薄種の有効拡散には Blanc の法則（式(11.109)）</text>
<text x="46" y="1346" class="small secondary">気体の温度依存は Ω_D の分だけ T^(3/2) より強くなる</text>
<text x="46" y="1384" class="small secondary">濃厚溶液では D が濃度で強く変わる（§11.11 の熱力学因子へ）</text>
<text x="380" y="1540" text-anchor="middle" class="small secondary">アプリ作成の独自図・模式図（原書図版ではない）</text>
</svg>
