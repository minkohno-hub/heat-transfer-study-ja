<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1050" viewBox="0 0 840 1050" style="max-width:100%" role="img" aria-labelledby="title4-4 desc4-4" data-lesson="4.4" data-origin="original-app-diagram" data-l="0.04" data-k="15" data-dt="80" data-s-ratio="2.5" data-s="0.1" data-q="120" data-s2="0.2" data-q2="240">
<title id="title4-4">§4.4 複雑な定常伝導の次元解析：尺度と形状係数</title>
<desc id="desc4-4">アプリ独自作成の模式図。等温境界を持つ定常伝導では伝熱量は熱伝導率・代表長さ・温度差の積に、形状比だけの無次元関数を掛けた形になり、形状係数Sを用いてQ＝kSΔTと書けることを示す。例として代表長さ0.040メートル、熱伝導率15、温度差80ケルビン、形状係数比2.50では伝熱量120ワット、全寸法を2倍に相似拡大すると240ワットになり、面積あたりの平均流束は半分になる。原著の図版の転載ではない。</desc>
<style>
text{font-family:system-ui,'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:23px}
.bg{fill:#ffffff}.panel{fill:#f4f7fa;stroke:#c2d1dd;stroke-width:2}.ink{fill:#173044}.muted{fill:#43596c}.warm{fill:#a84429}.cool{fill:#146b83}
.bar1{fill:#5396b4}.bar2{fill:#d98a16}.body1{fill:#b9cdd8;stroke:#43596c;stroke-width:2}.body2{fill:#e8cfa0;stroke:#43596c;stroke-width:2}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:20px}.tiny{font-size:19px}.equation{font-size:23px;font-weight:650}
@media(prefers-color-scheme:dark){.bg{fill:#101b26}.panel{fill:#1d2d3d;stroke:#657d91}.ink{fill:#f1f7fb}.muted{fill:#c8d8e5}.warm{fill:#ffb599}.cool{fill:#8fdaef}.bar1{fill:#2c6d88}.bar2{fill:#b97e22}.body1{fill:#3c5568;stroke:#c8d8e5}.body2{fill:#6b5f42;stroke:#c8d8e5}}
</style>
<rect class="bg" width="840" height="1050"/>
<text class="title ink" x="31" y="58">§4.4 次元解析で尺度と形状を分ける</text>
<text class="small muted" x="33" y="97">境界条件を適用する「前に」無次元化すると、代数と検算が楽になる</text>
<rect class="panel" x="23" y="119" width="794" height="252" rx="19"/>
<text class="section ink" x="43" y="161">① 定常伝導（等温境界・発熱なし）の無次元形</text>
<text class="equation ink" x="43" y="203">Q = kLΔT × Π（形状比のみ） ＝ kSΔT</text>
<text class="small ink" x="43" y="243">尺度 kLΔT は次元解析で決まる。S（形状係数、単位 m）は</text>
<text class="small ink" x="43" y="283">S = L × Π で、Π の中身は解くか実験で決めるほかない</text>
<text class="small muted" x="43" y="323">本書の例題4.7は、この無次元化を先に行う実演（非対称な対流境界＋発熱）</text>
<text class="small muted" x="43" y="355">注意： 記号 Γ の定義は例題4.6と例題4.7で異なる。使う前に定義を確認</text>
<rect class="panel" x="23" y="389" width="794" height="290" rx="19"/>
<text class="section ink" x="43" y="431">② 例：与えられた形状係数で計算する</text>
<rect class="body1" x="120" y="470" width="70" height="70"/>
<rect class="body2" x="330" y="440" width="140" height="140"/>
<text class="small ink" x="155" y="575" text-anchor="middle">元の形状</text>
<text class="small ink" x="400" y="615" text-anchor="middle">全寸法2倍（相似）</text>
<text class="small ink" x="43" y="470">L = 0.040 m、k = 15 W/(m·K)、ΔT = 80 K</text>
<text class="small ink" x="797" y="482" text-anchor="end">S/L = 2.50（解析で与えた値）</text>
<text class="small ink" x="797" y="522" text-anchor="end">→ S = 0.100 m</text>
<text class="small ink" x="797" y="562" text-anchor="end">→ Q = kSΔT = 120 W</text>
<text class="small muted" x="43" y="663">図形の大きさの比は模式図。S/L = 2.50 を次元解析だけで求めたとはしない</text>
<rect class="panel" x="23" y="697" width="794" height="206" rx="19"/>
<text class="section ink" x="43" y="739">③ 相似拡大の帰結</text>
<text class="small ink" x="43" y="781">Q： 120 W</text>
<rect class="bar1" id="bar-q1" x="300" y="760" width="190" height="20"/>
<text class="small ink" x="43" y="829">Q： 240 W（2倍）</text>
<rect class="bar2" id="bar-q2" x="300" y="808" width="380" height="20"/>
<text class="small muted" x="43" y="877">体積は8倍でも定常の全熱流は2倍。対応面積は4倍なので平均流束は半分</text>
<text class="tiny muted" x="43" y="954">境界を対流に変えて h を固定したまま拡大すると Bi が変わり、同じ Π は使えない</text>
<text class="tiny muted" x="420" y="1032" text-anchor="middle">アプリ作成の独自模式図｜原著の図版・描画の転載なし</text>
</svg>
