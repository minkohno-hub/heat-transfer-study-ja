<text class="small ink" x="76" y="334">下降方向</text>
<path class="flux" d="M359 339 H273 M287 328 L273 339 L287 350"/>
<text class="small ink" x="371" y="327">潜熱は液膜を横切る伝導で壁へ</text>
<text class="small ink" x="371" y="362">凝縮で加わる質量が Γ(x) を増やす</text>
<text class="small ink" x="371" y="425">単相流の「全流量一定」とは違う</text>
<text class="small ink" x="371" y="460">δ(x) ∝ x^(1/4)、局所 h_x = k_l/δ(x)</text>
<text class="small muted" x="45" y="584">※膜の描画幅は模式的。実際の長さ・厚さの比は表さない。</text>
<rect class="panel" x="23" y="621" width="794" height="293" rx="18"/>
<text class="section ink" x="43" y="662">② 速度分布 u/u_s = 2(y/δ) − (y/δ)²（x=L の断面）</text>
<path class="axis" d="M170 681 V826 H660 M649 818 L660 826 L649 834"/>
<path id="velocity-profile" class="graph" d="M 170.000 826.000 L 215.825 818.750 L 259.300 811.500 L 300.425 804.250 L 339.200 797.000 L 375.625 789.750 L 409.700 782.500 L 441.425 775.250 L 470.800 768.000 L 497.825 760.750 L 522.500 753.500 L 544.825 746.250 L 564.800 739.000 L 582.425 731.750 L 597.700 724.500 L 610.625 717.250 L 621.200 710.000 L 629.425 702.750 L 635.300 695.500 L 638.825 688.250 L 640.000 681.000"/>
<text x="60" y="690" class="micro ink">y=δ（表面）</text><text x="60" y="831" class="micro ink">y=0（壁）</text>
<text x="415" y="852" text-anchor="middle" class="micro ink">u/u_s →</text>
<text x="690" y="700" class="micro ink">u_s ≈ 0.0767 m/s</text>
<text x="690" y="730" class="micro muted">平均 ≈ (2/3)u_s</text>
<rect class="panel" x="23" y="932" width="794" height="291" rx="18"/>
<text class="section ink" x="43" y="973">③ 仮想例：L=0.20 m、幅 0.10 m、ΔT=10 K</text>
<text class="micro muted" x="43" y="1005">ρ_l=1000、ρ_v=1.0 kg/m³、μ_l=1.0×10^(-3) Pa·s、k_l=0.60 W/(m·K)</text>
<text class="micro muted" x="43" y="1034">h_fg=2.0×10^6 J/kg、g=9.81 m/s²（潜熱は補正潜熱が厳密。Ja 小で差は微小）</text>
<text class="eq ink" x="43" y="1104">δ(L) ≈ 0.1251 mm　 h_L ≈ 4796　 平均 h ≈ 6395 W/(m²·K)</text>
<text class="eq ink" x="43" y="1141">Q ≈ 1.279 kW　 Γ(L) ≈ 6.40×10^(-3) kg/(m·s)　 Re_f ≈ 25.6</text>
<text class="micro muted" x="43" y="1181">平均 h=(4/3)h_L。W·Γ(L)·h_fg = Q で収支が一致する。波・せん断は未評価。</text>

<text class="micro muted" x="420" y="1255" text-anchor="middle">アプリ作成の独自模式図｜原著図版の転載・トレースなし</text>
