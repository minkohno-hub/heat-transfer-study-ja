<title id="film2-title">§8.2 膜状凝縮の液膜：速度分布と単位幅流量</title>
<desc id="film2-desc">アプリが独自に作図した模式図。飽和蒸気が垂直冷壁で凝縮すると、重力と粘性の釣合いによる放物線状の速度分布を持つ層流液膜が流下し、凝縮した質量が加わって単位幅流量は下流ほど増える。仮想例（長さ0.20メートル、幅0.10メートル、温度差10ケルビン）では下端の膜厚は約0.1251ミリメートル、表面速度は約0.0767メートル毎秒、平均熱伝達率は約6395ワット毎平方メートルケルビン、全熱流は約1.279キロワット、液膜レイノルズ数は約25.6となる。膜厚の描画幅は実寸ではない。</desc>
