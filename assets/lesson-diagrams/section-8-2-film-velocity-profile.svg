<text class="title ink" x="30" y="59">§8.2 液膜の速度分布：放物線と流量</text>
<text class="small muted" x="30" y="101">垂直冷壁の層流液膜：重力と粘性の釣合い、表面でせん断なし</text>
<rect class="panel" x="23" y="126" width="794" height="477" rx="18"/>
<text class="section ink" x="43" y="169">① 液膜は下流ほど厚くなり、質量が増える</text>
<text class="small muted" x="45" y="210">壁温 T_w ＜ 飽和温度 T_sat ／ 下向き x、壁から外向き y</text>
<rect class="wall" x="187" y="275" width="26" height="279" rx="3"/>
