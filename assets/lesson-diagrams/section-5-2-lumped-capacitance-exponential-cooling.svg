<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1230" viewBox="0 0 840 1230" style="max-width:100%" role="img" aria-labelledby="lumped-title lumped-desc" data-origin="original-app-diagram" data-lesson="5.2" data-mass="1" data-heat-capacity="500" data-density="5000" data-conductivity-solid="50" data-area-convection="0.1" data-h-convection="20" data-temp-initial="100" data-temp-ambient="20" data-time-eval="250" data-volume="0.0002" data-characteristic-length="0.002" data-biot="0.0008" data-thermal-capacitance="500" data-conductance="2" data-tau="250" data-temperature-at-tau="49.4303552937" data-heat-released="25284.822353142" data-alpha-solid="0.00002" data-fourier-at-tau="1250" data-plot-points="41">
<title id="lumped-title">§5.2 集中熱容量法：小さいBiot数、時定数と指数冷却</title>
<desc id="lumped-desc">アプリ独自図。内部がほぼ一様温度であると仮定できる固体の対流冷却を示す。初期100℃、周囲20℃、質量1.0キログラム、比熱500ジュール毎キログラムケルビン、密度5000キログラム毎立方メートル、固体熱伝導率50ワット毎メートルケルビン、露出対流面積0.10平方メートル、熱伝達率20ワット毎平方メートルケルビン。特性長さは体積÷対流面積で0.002メートル、Biot数0.0008。熱容量500ジュール毎ケルビン、対流コンダクタンス2ワット毎ケルビン、時定数250秒。指数冷却曲線は無次元温度差θ＝expマイナスt割るτを41点計算して描き、横軸は0から1000秒。250秒後には温度差が初期の約36.8パーセント残り、温度は49.43℃。放出した顕熱は約25.28キロジュール。縦軸の0.368は温度の摂氏値に対する割合ではない。Biot数が0.1より小さいという判定は経験的な近似目安であり、放射・内部発熱・接触面・温度依存物性は含まない。</desc>
<style>
text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:23px}
.bg{fill:#fff}.panel{fill:#f4f7fa;stroke:#bfd0dc;stroke-width:2}.ink{fill:#173045}.muted{fill:#475f70}.highlight{fill:#176f91}.warm{fill:#a6512f}
.solid{fill:#e2a57e;stroke:#ad623a;stroke-width:2.6}.flow{stroke:#bc623e;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.axis{stroke:#37556d;stroke-width:2.5;fill:none}.guides{stroke:#b8ccda;stroke-width:1.6;stroke-dasharray:5 6}.curve{stroke:#1880a5;stroke-width:4.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.mark{fill:#a74b7c;stroke:#fff;stroke-width:2}.event{stroke:#a74b7c;stroke-width:2.4;stroke-dasharray:8 5}.eventLabel{fill:#99406d}
.title{font-size:33px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:20px}.micro{font-size:18px}.formula{font-size:24px;font-weight:650}
