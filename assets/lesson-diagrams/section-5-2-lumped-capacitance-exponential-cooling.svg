<rect class="bg" width="840" height="1230"/>
<text class="title ink" x="31" y="58">§5.2 集中熱容量法：指数冷却と時定数</text>
<text class="small muted" x="32" y="100">内部温度を一様とみなす近似と、周囲との差の減り方</text>

<rect class="panel" x="23" y="121" width="794" height="289" rx="19"/>
<text class="section ink" x="44" y="166">① 小さいBi：内部伝導が十分速い場合</text>
<rect class="solid" x="160" y="208" width="159" height="111" rx="10"/>
<text class="small ink" text-anchor="middle" x="239" y="252">固体内は</text>
<text class="small ink" text-anchor="middle" x="239" y="283">一様温度 T(t)</text>
<path class="flow" d="M144 264 H84 M97 252 L84 264 L97 276 M336 264 H402 M388 252 L402 264 L388 276"/>
<text class="small warm" x="424" y="253">対流で外へ放熱</text>
<text class="small muted" x="425" y="285">周囲温度 20 ℃</text>
<text class="small ink" x="44" y="357">L_c = V/A_s = 0.0020 m ／ Bi = hL_c/k_s = 0.00080</text>
<text class="micro muted" x="44" y="390">Bi &lt; 0.1は一般的な近似目安。k_sは固体の熱伝導率。</text>

<rect class="panel" x="23" y="426" width="794" height="430" rx="19"/>
<text class="section ink" x="44" y="467">② 時間で減るのは「周囲との温度差」</text>
<text class="micro muted" x="44" y="500">縦軸：Θ = (T−T∞)/(T₀−T∞) ／ 横軸：時間 [s]</text>
<path class="axis" d="M195 507 V722 H708 M700 715 L708 722 L700 729"/>
<path class="guides" d="M195 502 H699 M195 612 H699 M195 641.067 H699"/>
<path id="lumped-exponential-curve" class="curve" d="M195.000 502.000 L207.600 522.936 L220.200 541.879 L232.800 559.020 L245.400 574.530 L258.000 588.563 L270.600 601.261 L283.200 612.751 L295.800 623.148 L308.400 632.555 L321.000 641.067 L333.600 648.768 L346.200 655.737 L358.800 662.043 L371.400 667.749 L384.000 672.911 L396.600 677.583 L409.200 681.810 L421.800 685.634 L434.400 689.095 L447.000 692.226 L459.600 695.060 L472.200 697.623 L484.800 699.943 L497.400 702.042 L510.000 703.941 L522.600 705.660 L535.200 707.215 L547.800 708.622 L560.400 709.895 L573.000 711.047 L585.600 712.089 L598.200 713.032 L610.800 713.886 L623.400 714.658 L636.000 715.357 L648.600 715.989 L661.200 716.561 L673.800 717.078 L686.400 717.547 L699.000 717.971"/>
<path id="tau-marker" class="event" d="M321 507 V722"/>
<circle class="mark" cx="321.000" cy="641.067" r="7"/>
<text x="177" y="515" text-anchor="end" class="micro ink">1.0</text>
<text x="177" y="618" text-anchor="end" class="micro ink">0.5</text>
<text x="177" y="647" text-anchor="end" class="micro eventLabel">0.368</text>
<text x="177" y="726" text-anchor="end" class="micro ink">0</text>
<text x="195" y="749" text-anchor="middle" class="micro ink">0</text>
<text x="321" y="749" text-anchor="middle" class="micro ink">250</text>
<text x="447" y="749" text-anchor="middle" class="micro ink">500</text>
<text x="573" y="749" text-anchor="middle" class="micro ink">750</text>
<text x="699" y="749" text-anchor="middle" class="micro ink">1000</text>
<text x="46" y="803" class="small ink">t = τ = 250 s なら Θ = e^(−1) ≈ 0.368</text>
<text x="46" y="836" class="micro muted">※摂氏温度そのものが36.8%になるという意味ではない。</text>

<rect class="panel" x="23" y="875" width="794" height="306" rx="19"/>
<text class="section ink" x="44" y="919">③ 熱収支と例題の検算</text>
<text class="small ink" x="44" y="963">m = 1.0 kg、c = 500 J/(kg·K)、h = 20 W/(m²·K)</text>
<text class="small ink" x="44" y="998">A_s = 0.10 m²、T₀ = 100 ℃、T∞ = 20 ℃</text>
<text class="formula ink" x="44" y="1037">τ = mc/(hA_s) = 500/2 = 250 s</text>
<text class="formula ink" x="44" y="1076">T(250 s) = 20 + 80e^(−1) ≈ 49.43 ℃</text>
<text class="formula ink" x="44" y="1115">Q_release = mc(T₀−T) ≈ 25.28 kJ</text>
<text class="micro muted" x="44" y="1157">一定物性・初期一様温度。放射、発熱、相変化を無視。</text>
<text x="420" y="1212" text-anchor="middle" class="micro muted">アプリ独自作図｜原著図版の転載・トレースなし</text>
</svg>
