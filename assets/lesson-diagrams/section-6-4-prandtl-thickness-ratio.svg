<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1160" viewBox="0 0 820 1160" style="max-width:100%" role="img" aria-labelledby="title64 desc64" data-lesson="6.4" data-origin="original-app-diagram" data-uinf="1" data-x="0.4" data-nu="0.000008" data-alpha-fluid="0.000001" data-pr="8" data-re-x="50000" data-delta="0.00894427191" data-ratio="0.5" data-delta-t="0.004472135955" data-static-ratio="0.353553390593" data-bar-scale="380">
<title id="title64">§6.4 Prandtl数と二つの境界層の厚さ</title>
<desc id="desc64">アプリ独自の図。Prandtl数8の等温平板層流では速度境界層の目安が約8.94ミリメートル、温度境界層の尺度はその約半分の4.47ミリメートルになることを示す。厚さ比Prのマイナス3分の1乗はPr0.7で1.126、Pr1で1、Pr8で0.5。静止拡散の比較では指数がマイナス2分の1乗となり、定常平板の尺度とは別である。99パーセント厚さから熱伝達率を厳密には決められない。</desc>
