 .zone{fill:#dcebf4}
 .heading{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:21px}.micro{font-size:19px}.result{font-size:25px;font-weight:700}
 @media(prefers-color-scheme:dark){
 .bg{fill:#101925}.panel{fill:#1b2c3b;stroke:#627f92}.ink{fill:#eff7fc}.muted{fill:#c3d8e5}
 .accent{fill:#8bd7f5}.accent2{fill:#f6bb92}
 .line1{stroke:#8bd7f5}.line2{stroke:#f6bb92}.wall{stroke:#d1e7f5}.axis{stroke:#d1e7f5}.dash{stroke:#c3d8e5}
 .barA{fill:#2e7ca6}.barB{fill:#c97e4e}.barC{fill:#5d7f95}.zone{fill:#234860}
