<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1368" viewBox="0 0 840 1368" role="img" aria-labelledby="product-title product-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="5.8" data-biot="1" data-fourier="0.5" data-lambda-1="0.860333589019" data-center-1d="0.772955693333" data-mean-1d="0.681069447035" data-center-product="0.597460503856" data-mean-product="0.463855591685" data-heat-fraction="0.536144408315" data-naive-sum="0.63786110593">
  <title id="product-title">§5.8 積解：二方向の冷却は積で合成する</title>
  <desc id="product-desc">アプリ作成の独自図解。長い正方形柱の断面を二方向から冷却する。半寸法0.010メートル、各面の熱伝達率100、熱伝導率1.0でBiは1、50秒でFoは0.50。一次元の一項値は中心0.772955693、平均0.681069447。積解では中心はその二乗0.597460504で67.80度、平均は二乗0.463855592で57.11度、放出顕熱は53.6パーセント。一次元の放出割合を単純に2倍する0.637861106は誤りで、顕熱は残っている分への上乗せで合成される。</desc>
  <style>
    .background{fill:#fff}.panel{fill:#f4f7fb;stroke:#bbccd9;stroke-width:2}
    .ink{fill:#193043}.secondary{fill:#465b6c}.cold{fill:#1c7194}.later{fill:#8b4eae}.hot{fill:#b3402f}.warn{fill:#b3402f}
    .slab{fill:#d6e9ef;stroke:#528096;stroke-width:3}.axis{stroke:#304c60;stroke-width:2.4;fill:none}
    .guide{stroke:#aebfcc;stroke-width:1.4;stroke-dasharray:6 7}.initial{stroke:#5c6e7c;stroke-width:3.4;fill:none;stroke-dasharray:10 6}
    .quarter{stroke:#1c7194;stroke-width:4.6;fill:none;stroke-linejoin:round}.one{stroke:#8b4eae;stroke-width:4.6;fill:none;stroke-linejoin:round}
    .hotline{stroke:#b3402f;stroke-width:4.6;fill:none;stroke-linejoin:round}.dashline{stroke:#5c6e7c;stroke-width:3.2;fill:none;stroke-dasharray:9 7}
    .arrow{stroke:#1c7194;stroke-width:4.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .bar-cold{fill:#1c7194}.bar-later{fill:#8b4eae}.bar-warn{fill:#c98a8a}.bar-hot{fill:#b3402f}
    .edge-hot{stroke:#b3402f;stroke-width:7}.edge-cold{stroke:#528096;stroke-width:5}
    text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:25px}.title{font-size:35px;font-weight:700}.section{font-size:27px;font-weight:700}.small{font-size:22px}.formula{font-size:25px;font-weight:600}
    @media(prefers-color-scheme:dark){.background{fill:#111a24}.panel{fill:#1c2c3b;stroke:#60798a}.ink{fill:#eef6ff}.secondary{fill:#cad9e4}.cold{fill:#89d8f4}.later{fill:#dbb4ff}.hot{fill:#ff9d8f}.warn{fill:#ff9d8f}.slab{fill:#22485f;stroke:#91c2dc}.axis{stroke:#d3e4ef}.guide{stroke:#647e90}.initial{stroke:#bed0da}.quarter,.arrow{stroke:#89d8f4}.one{stroke:#dbb4ff}.hotline{stroke:#ff9d8f}.dashline{stroke:#bed0da}.bar-warn{fill:#8a5a5a}}
  </style>
  <rect class="background" width="840" height="1368"/>
  <text x="36" y="58" class="title ink">§5.8 積解：二方向は積で合成</text>
  <text x="36" y="100" class="small secondary">中心は 0.773²、平均は 0.681²。足し算ではない。</text>
  <rect x="24" y="123" width="792" height="300" rx="19" class="panel"/>
