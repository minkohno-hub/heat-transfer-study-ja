  <text x="48" y="1147" class="small ink">中心 Θ = 0.597461 → 67.80℃（一方向だけなら 81.84℃）</text>
  <text x="48" y="1184" class="small ink">平均 Θ̄ = 0.463856 → 57.11℃ ｜ 放出顕熱 53.6%</text>
