  <text x="48" y="880" class="small secondary">Φ = Φ₁ + Φ₂(1 − Φ₁)：残っている分への上乗せ</text>
  <text x="48" y="924" class="small ink">一方向だけ</text>
  <rect id="bar-one-dir" x="250" y="902" width="153.09" height="20" class="bar-later"/>
  <text x="417.09" y="924" class="small ink">Φ₁ = 0.319</text>
  <text x="48" y="984" class="small ink">単純和（誤り）</text>
  <rect id="bar-naive" x="250" y="962" width="306.17" height="20" class="bar-warn"/>
  <text x="570.17" y="984" class="small warn">0.638 ✗</text>
  <text x="48" y="1044" class="small ink">積解</text>
  <rect id="bar-product" x="250" y="1022" width="257.35" height="20" class="bar-cold"/>
  <text x="521.35" y="1044" class="small ink">Φ = 0.536</text>
