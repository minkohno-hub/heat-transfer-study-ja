<text class="title ink" x="30" y="59">§9.6 遷移沸騰：濡れ割合が平均熱流束を下げる</text>
<text class="small muted" x="30" y="101">局所値は固定でも、濡れ面積の割合 f が減れば面平均は下がる</text>
<rect class="panel" x="23" y="126" width="794" height="477" rx="18"/>
<text class="section ink" x="43" y="169">① 面は濡れた部分と蒸気に覆われた部分の混在</text>
