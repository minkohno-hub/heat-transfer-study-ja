idth="24" height="24"/><rect class="dry" x="714" y="406" width="24" height="24"/><rect class="dry" x="480" y="432" width="24" height="24"/><rect class="dry" x="506" y="432" width="24" height="24"/><rect class="dry" x="532" y="432" width="24" height="24"/><rect class="dry" x="558" y="432" width="24" height="24"/><rect class="dry" x="584" y="432" width="24" height="24"/><rect class="dry" x="610" y="432" width="24" height="24"/><rect class="dry" x="636" y="432" width="24" height="24"/><rect class="dry" x="662" y="432" width="24" height="24"/><rect class="dry" x="688" y="432" width="24" height="24"/><rect class="dry" x="714" y="432" width="24" height="24"/><rect class="dry" x="480" y="458" width="24" height="24"/><rect class="dry" x="506" y="458" width="24" height="24"/><rect class="dry" x="532" y="458" width="24" height="24"/><rect class="dry" x="558" y="458" width="24" height="24"/><rect class="dry" x="584" y="458" width="24" height="24"/><rect class="dry" x="610" y="458" width="24" height="24"/><rect class="dry" x="636" y="458" width="24" height="24"/><rect class="dry" x="662" y="458" width="24" height="24"/><rect class="dry" x="688" y="458" width="24" height="24"/><rect class="dry" x="714" y="458" width="24" height="24"/><rect class="dry" x="480" y="484" width="24" height="24"/><rect class="dry" x="506" y="484" width="24" height="24"/><rect class="dry" x="532" y="484" width="24" height="24"/><rect class="dry" x="558" y="484" width="24" height="24"/><rect class="dry" x="584" y="484" width="24" height="24"/><rect class="dry" x="610" y="484" width="24" height="24"/><rect class="dry" x="636" y="484" width="24" height="24"/><rect class="dry" x="662" y="484" width="24" height="24"/><rect class="dry" x="688" y="484" width="24" height="24"/><rect class="dry" x="714" y="484" width="24" height="24"/></g>
<text class="small ink" x="70" y="540">状態1：f=0.60（青＝濡れ）</text>
<text class="small ink" x="480" y="540">状態2：f=0.20</text>
<text class="small muted" x="45" y="584">各マスは面積の模式分割。局所熱流束 q″_wet=300、q″_dry=30 kW/m² と固定。</text>
<rect class="panel" x="23" y="621" width="794" height="293" rx="18"/>
<text class="section ink" x="43" y="662">② 面平均 q̄″ = f·q″_wet + (1−f)·q″_dry［kW/m²］</text>
<rect class="barWet" x="180" y="690" width="480.0" height="30"/><text class="small ink" x="60" y="713">濡れ部</text><text class="small ink" x="670.0" y="713">300</text><rect class="barDry" x="180" y="740" width="48.0" height="30"/><text class="small ink" x="60" y="763">蒸気部</text><text class="small ink" x="238.0" y="763">30</text><rect class="barMean" x="180" y="790" width="307.2" height="30"/><text class="small ink" x="60" y="813">平均 f=0.60</text><text class="small ink" x="497.2" y="813">192</text><rect class="barMean2" x="180" y="840" width="134.4" height="30"/><text class="small ink" x="60" y="863">平均 f=0.20</text><text class="small ink" x="324.4" y="863">84</text>
<text class="micro muted" x="43" y="900">平均は 192 → 84 kW/m²。温度が上がる方向で平均が下がる＝負の傾き。</text>
<rect class="panel" x="23" y="932" width="794" height="291" rx="18"/>
<text class="section ink" x="43" y="973">③ 熱移動率と不安定性</text>
<text class="eq ink" x="43" y="1040">A=0.010 m²：Q は 1920 W → 840 W（−1080 W）</text>
<text class="small ink" x="43" y="1090">負の傾きのため本質的に不安定で、持続するのは</text>
<text class="small ink" x="43" y="1125">壁温を固定できる場合に限られる</text>
<text class="micro muted" x="43" y="1181">接触角・表面状態に最も敏感な領域。上昇時と下降時で曲線がずれる（ヒステリシス）。</text>

<text class="micro muted" x="420" y="1255" text-anchor="middle">アプリ作成の独自模式図｜原著図版の転載・トレースなし</text>
