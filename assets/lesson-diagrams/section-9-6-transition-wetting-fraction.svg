<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1280" viewBox="0 0 840 1280" role="img" aria-labelledby="trans-title trans-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="9.6" data-q-wet="300000" data-q-dry="30000" data-f-1="0.6" data-f-2="0.2" data-mean-1="192000" data-mean-2="84000" data-area="0.01" data-q-rate-1="1920" data-q-rate-2="840" data-model="two-region-area-average">
<title id="trans-title">§9.6 遷移沸騰：濡れ割合と面平均熱流束の負の傾き</title>
<desc id="trans-desc">アプリが独自に作図した模式図。遷移沸騰の加熱面は、液体が触れる濡れた部分と蒸気に覆われた部分の混在であり、各部分の局所熱流束を固定しても、濡れ面積の割合が0.60から0.20へ減ると面平均熱流束は192から84キロワット毎平方メートルへ下がる。面積0.010平方メートルでは全熱移動率は1920ワットから840ワットへ下がる。この負の傾きが遷移沸騰の不安定性の原因であり、壁温を絶対的に固定できる場合にのみ持続する。</desc>
