  <title id="chart-title">§5.4 温度応答線図：中心・位置・平均の読み方</title>
  <desc id="chart-desc">アプリ作成の独自図解。温度応答線図の読み方を、平板のBiイコール1、Foイコール0.5の一項近似の照合値で示す。中心の無次元温度は0.772956、中心から半分の位置では位置比0.908896を掛けて0.702536、体積平均は0.681069。摂氏では中心81.84度、指定位置76.20度、平均74.49度で、放出顕熱の割合は約31.9パーセント。線図そのものの転載ではなく、形状と特性長さと境界条件をそろえて読む手順を示す。</desc>
