<text class="small ink" x="450" y="395">強制対流より厚くなりやすい</text>
<text class="small ink" x="450" y="460">物性は膜温度 T_f=(T_w+T_∞)/2 で評価</text>
<text class="small muted" x="45" y="584">※境界層の描画幅は模式的。実際の長さ・厚さの比は表さない。</text>
