<title id="nc-title">§8.3 等温垂直面の層流自然対流：境界層と Churchill–Chu 式</title>
<desc id="nc-desc">アプリが独自に作図した模式図。等温の垂直温壁に沿って自然対流境界層が発達し、厚さは下降ではなく上昇距離の4分の1乗に比例して増える。古典的な積分解では温度分布は2次式、速度分布は層の内側に極大を持つ形になる。仮想例（高さ0.50メートル、温度差20ケルビン、レイリー数約2.30かける10の8乗）では Churchill–Chu の層流式で平均ヌセルト数は約64.17、平均熱伝達率は約3.427ワット毎平方メートルケルビン、片面の対流熱流は約6.85ワットとなる。境界層の描画幅は実寸ではない。</desc>
