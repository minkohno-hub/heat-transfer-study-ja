 .nucleate{fill:none;stroke:#238d7c;stroke-width:5;stroke-linecap:round}
 .transition{fill:none;stroke:#c06443;stroke-width:5;stroke-linecap:round}
 .film{fill:none;stroke:#7c61ae;stroke-width:5;stroke-linecap:round}
 .chf{fill:#bd493f;stroke:#fff;stroke-width:2}.minimum{fill:#7957a9;stroke:#fff;stroke-width:2}
 .flag{fill:#fbeadd;stroke:#dfbd9d;stroke-width:1.5}
 .heading{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}
