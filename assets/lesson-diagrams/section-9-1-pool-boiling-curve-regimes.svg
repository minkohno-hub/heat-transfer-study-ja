<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1280" viewBox="0 0 880 1280" role="img" aria-labelledby="boiling-title boiling-description" style="max-width:100%" data-origin="original-app-diagram" data-lesson="9.1" data-q-w="200" data-area-m2="0.01" data-twall-c="120" data-tsat-c="100" data-superheat-k="20" data-flux-wm2="20000" data-h-effective="1000" data-chf-known="false" data-regime-known="false" data-boiling-curve="schematic-not-to-scale">
<title id="boiling-title">§9.1 プール沸騰曲線：核沸騰、限界熱流束CHF、遷移・膜沸騰</title>
<desc id="boiling-description">アプリ独自の教育用模式図。横軸は加熱面の飽和温度からの過熱度、縦軸は熱流束。ただしどちらの軸も数値目盛なしで、曲線の座標・傾き・高さに実測値を対応させていない。自然対流から核沸騰に入り、限界熱流束CHFに相当する局所最大を経て遷移沸騰で熱流束が低下し、最小熱流束の概念点を経て膜沸騰へ移る典型的な形状を説明する。温度制御と熱流束制御では運転経路が違うことがある。別枠の例題は加熱面積0.010平方メートル、熱移動率200ワット、加熱面120度、同圧力の飽和温度100度から過熱度20ケルビン、熱流束20000ワット毎平方メートル、見かけの伝熱係数1000ワット毎平方メートルケルビンを計算する。流体、圧力、表面状態などに対応したCHFデータはないため、例題の沸騰領域や安全性は判定できない。プール沸騰は強制主流がない状態だが気泡や浮力による流れはある。</desc>
<style>
 text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:24px}
