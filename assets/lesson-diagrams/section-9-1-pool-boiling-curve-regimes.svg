 .axis{stroke:#d1e5f3}.divider{stroke:#8ca5b8}.natural{stroke:#8fc6e5}.nucleate{stroke:#74dfbc}
 .transition{stroke:#ffab86}.film{stroke:#cab0fa}.chf{fill:#ff9185;stroke:#254055}.minimum{fill:#cca9ff;stroke:#254055}
 .flag{fill:#443428;stroke:#927154}
 }
</style>
<rect class="bg" width="880" height="1280"/>
<text class="heading ink" x="29" y="58">§9.1 プール沸騰曲線と限界熱流束</text>
<text class="small muted" x="31" y="103">代表的な領域を読むための模式図。運転可能域を保証する図ではない。</text>

<rect class="panel" x="23" y="123" width="834" height="704" rx="18"/>
<text class="section ink" x="43" y="165">① 熱流束と表面過熱度の概念的な関係</text>
<text class="micro muted" x="44" y="203">縦：熱流束 q″（目盛なし） ／ 横：表面過熱度 ΔT_sat（目盛なし）</text>
<text class="micro muted" x="44" y="231">曲線形状・領域境界は模式的。実験・相関式の数値ではない。</text>

<path id="boiling-axes" class="axis" d="M125 255 V609 H806 M115 269 L125 255 L135 269 M793 599 L806 609 L793 619"/>
<text class="micro ink" x="141" y="269">q″ 増加</text>
<text class="micro ink" x="573" y="640">表面過熱度 ΔT_sat 増加 →</text>
<path id="boiling-natural" class="natural" d="M130 590 C174 584 194 564 225 528"/>
<path id="boiling-nucleate" class="nucleate" d="M225 528 C271 486 281 350 333 288 C355 257 376 244 412 244"/>
<path id="boiling-transition" class="transition" d="M412 244 C470 244 489 522 552 522"/>
<path id="boiling-film" class="film" d="M552 522 C601 522 602 448 657 414 C696 383 750 370 795 314"/>
<path class="divider" d="M412 253 V609 M552 529 V609"/>
<circle id="chf-point" class="chf" cx="412" cy="244" r="7"/>
<circle id="minimum-point" class="minimum" cx="552" cy="522" r="7"/>
<text class="small ink" x="412" y="288" text-anchor="middle">CHF（限界熱流束）</text>
<text class="micro ink" x="582" y="558">最小熱流束</text>

<text class="micro ink" x="157" y="665" text-anchor="middle">自然対流</text>
<text class="micro ink" x="311" y="665" text-anchor="middle">核沸騰</text>
<text class="micro ink" x="478" y="665" text-anchor="middle">遷移沸騰</text>
<text class="micro ink" x="711" y="665" text-anchor="middle">膜沸騰</text>

<rect class="flag" x="43" y="688" width="790" height="107" rx="11"/>
<text class="small ink" x="60" y="718">注意：CHFは液体・圧力・面の状態・向きなどで変わる。</text>
<text class="micro ink" x="60" y="750">遷移域は不安定になり得る。温度制御と熱流束制御では、</text>
<text class="micro ink" x="60" y="780">実際の運転経路が異なり、この曲線を順番になぞるとは限らない。</text>

<rect class="panel" x="23" y="845" width="834" height="389" rx="18"/>
<text class="section ink" x="43" y="887">② 例題：熱流束を求める。CHFの判定は別</text>
<text class="small ink" x="44" y="934">加熱面積 A = 0.010 m²、熱移動率 Q = 200 W</text>
<text class="small ink" x="44" y="977">壁温 T_w = 120 ℃、飽和温度 T_sat = 100 ℃</text>
<text class="formula ink" x="44" y="1027">ΔT_sat = T_w − T_sat = 20 K</text>
<text class="formula ink" x="44" y="1070">q″ = Q/A = 20,000 W/m² = 20 kW/m²</text>
<text class="formula ink" x="44" y="1113">h_eff = q″/ΔT_sat = 1,000 W/(m²·K)</text>
<text class="small ink" x="44" y="1161">CHF値が不明：沸騰領域・安全性は判定できない。</text>
<text class="micro muted" x="44" y="1198">h_effはこの一点での比。全領域で一定の伝熱係数ではない。</text>
<text class="micro muted" x="440" y="1261" text-anchor="middle">アプリ独自模式図｜原著図版の転載・トレース・逐文翻訳なし</text>
</svg>
