<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1390" viewBox="0 0 840 1390" role="img" aria-labelledby="steady2d-title steady2d-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="5.7" data-cold-c="20" data-hot-c="100" data-center-theta="0.25" data-center-temperature="40" data-partial-1="0.253716416661" data-partial-2="0.24990409719" data-partial-3="0.250002952309">
  <title id="steady2d-title">§5.7 定常二次元伝導：正方形の中心温度と級数の収束</title>
  <desc id="steady2d-desc">アプリ作成の独自図解。正方形断面の定常二次元伝導で、三辺を20度、上辺を100度に保つ。無次元温度シータは上辺だけ1、他は0。中心は線形性と回転対称性からシータ4分の1、つまり40度になる。正弦級数の部分和は1項で0.253716417、3項までで0.249904097、5項までで0.250002952と、対称性の答えへ収束する。中心線の温度プロファイルも級数から計算した。</desc>
  <style>
    .background{fill:#fff}.panel{fill:#f4f7fb;stroke:#bbccd9;stroke-width:2}
    .ink{fill:#193043}.secondary{fill:#465b6c}.cold{fill:#1c7194}.later{fill:#8b4eae}.hot{fill:#b3402f}.warn{fill:#b3402f}
    .slab{fill:#d6e9ef;stroke:#528096;stroke-width:3}.axis{stroke:#304c60;stroke-width:2.4;fill:none}
    .guide{stroke:#aebfcc;stroke-width:1.4;stroke-dasharray:6 7}.initial{stroke:#5c6e7c;stroke-width:3.4;fill:none;stroke-dasharray:10 6}
    .quarter{stroke:#1c7194;stroke-width:4.6;fill:none;stroke-linejoin:round}.one{stroke:#8b4eae;stroke-width:4.6;fill:none;stroke-linejoin:round}
    .hotline{stroke:#b3402f;stroke-width:4.6;fill:none;stroke-linejoin:round}.dashline{stroke:#5c6e7c;stroke-width:3.2;fill:none;stroke-dasharray:9 7}
    .arrow{stroke:#1c7194;stroke-width:4.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .bar-cold{fill:#1c7194}.bar-later{fill:#8b4eae}.bar-warn{fill:#c98a8a}.bar-hot{fill:#b3402f}
    .edge-hot{stroke:#b3402f;stroke-width:7}.edge-cold{stroke:#528096;stroke-width:5}
    text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:25px}.title{font-size:35px;font-weight:700}.section{font-size:27px;font-weight:700}.small{font-size:22px}.formula{font-size:25px;font-weight:600}
    @media(prefers-color-scheme:dark){.background{fill:#111a24}.panel{fill:#1c2c3b;stroke:#60798a}.ink{fill:#eef6ff}.secondary{fill:#cad9e4}.cold{fill:#89d8f4}.later{fill:#dbb4ff}.hot{fill:#ff9d8f}.warn{fill:#ff9d8f}.slab{fill:#22485f;stroke:#91c2dc}.axis{stroke:#d3e4ef}.guide{stroke:#647e90}.initial{stroke:#bed0da}.quarter,.arrow{stroke:#89d8f4}.one{stroke:#dbb4ff}.hotline{stroke:#ff9d8f}.dashline{stroke:#bed0da}.bar-warn{fill:#8a5a5a}}
  </style>
  <rect class="background" width="840" height="1390"/>
  <text x="36" y="58" class="title ink">§5.7 正方形の中心は 40℃</text>
  <text x="36" y="100" class="small secondary">三辺 20℃・上辺 100℃。級数は対称性の答えへ収束する。</text>
  <rect x="24" y="123" width="792" height="330" rx="19" class="panel"/>
  <text x="48" y="166" class="section ink">① 境界条件：三辺 20℃・上辺 100℃</text>
  <path class="edge-cold" d="M300 420 V180 M540 180 V420 M300 420 H540"/>
  <path class="edge-hot" d="M300 180 H540"/>
  <text x="420" y="216" text-anchor="middle" class="small hot">上辺 100℃</text>
  <text x="288" y="305" text-anchor="end" class="small cold">20℃</text>
  <text x="552" y="305" class="small cold">20℃</text>
  <text x="420" y="443" text-anchor="middle" class="small cold">下辺 20℃</text>
  <circle cx="420" cy="300" r="8" class="bar-hot"/>
  <text x="420" y="277" text-anchor="middle" class="small ink">中心 θ = 1/4</text>
  <text x="612" y="230" class="small ink">θ = (T − 20)/80</text>
  <text x="612" y="270" class="small ink">上辺だけ θ = 1</text>
  <text x="612" y="310" class="small ink">他は θ = 0</text>
  <text x="612" y="350" class="small secondary">中心は対称性で 1/4</text>
  <rect x="24" y="471" width="792" height="360" rx="19" class="panel"/>
  <text x="48" y="514" class="section ink">② 中心線の温度プロファイル</text>
  <path class="quarter" d="M170 541 H210"/><text x="219" y="548" class="small ink">縦中心線（下→上）</text>
  <path class="one" d="M445 541 H485"/><text x="494" y="548" class="small ink">横中心線</text>
  <path class="guide" d="M150 680 H790 M150 730 H790"/>
  <path class="axis" d="M137 568 V782 H796 M783 774 L796 782 L783 790"/>
  <path id="profile-vertical" class="quarter" d="M150.00,780.00 L166.00,778.27 L182.00,776.53 L198.00,774.77 L214.00,772.97 L230.00,771.14 L246.00,769.25 L262.00,767.29 L278.00,765.26 L294.00,763.14 L310.00,760.92 L326.00,758.58 L342.00,756.12 L358.00,753.51 L374.00,750.75 L390.00,747.81 L406.00,744.69 L422.00,741.37 L438.00,737.82 L454.00,734.04 L470.00,730.00 L486.00,725.69 L502.00,721.08 L518.00,716.17 L534.00,710.93 L550.00,705.35 L566.00,699.41 L582.00,693.10 L598.00,686.42 L614.00,679.35 L630.00,671.89 L646.00,664.05 L662.00,655.84 L678.00,647.27 L694.00,638.36 L710.00,629.15 L726.00,619.66 L742.00,609.95 L758.00,600.07 L774.00,590.06 L790.00,578.75"/>
  <path id="profile-horizontal" class="one" d="M150.00,780.00 L166.00,775.83 L182.00,771.70 L198.00,767.64 L214.00,763.68 L230.00,759.86 L246.00,756.20 L262.00,752.72 L278.00,749.45 L294.00,746.40 L310.00,743.59 L326.00,741.03 L342.00,738.73 L358.00,736.69 L374.00,734.92 L390.00,733.42 L406.00,732.19 L422.00,731.23 L438.00,730.55 L454.00,730.14 L470.00,730.00 L486.00,730.14 L502.00,730.55 L518.00,731.23 L534.00,732.19 L550.00,733.42 L566.00,734.92 L582.00,736.69 L598.00,738.73 L614.00,741.03 L630.00,743.59 L646.00,746.40 L662.00,749.45 L678.00,752.72 L694.00,756.20 L710.00,759.86 L726.00,763.68 L742.00,767.64 L758.00,771.70 L774.00,775.83 L790.00,780.00"/>
  <circle cx="470" cy="730" r="8" class="bar-hot"/>
  <text x="486" y="716" class="small hot">中心 θ = 0.25</text>
  <text x="96" y="587" class="small secondary">θ = 1</text>
  <text x="96" y="687" class="small secondary">0.5</text>
  <text x="96" y="787" class="small secondary">0</text>
  <text x="150" y="810" text-anchor="middle" class="small ink">0</text>
  <text x="470" y="810" text-anchor="middle" class="small ink">0.5</text>
  <text x="790" y="810" text-anchor="middle" class="small ink">1（位置）</text>
  <rect x="24" y="849" width="792" height="300" rx="19" class="panel"/>
  <text x="48" y="892" class="section ink">③ 級数の部分和は 1/4 へ収束する</text>
  <path class="guide" d="M150 1055.38 H790"/>
  <path class="axis" d="M137 928 V1092 H796 M783 1084 L796 1092 L783 1100"/>
  <path id="center-partials" class="quarter" d="M240.00,969.62 L460.00,1057.60 L680.00,1055.32"/>
  <circle cx="240" cy="969.62" r="8" class="bar-cold"/>
  <circle cx="460" cy="1057.60" r="8" class="bar-cold"/>
  <circle cx="680" cy="1055.32" r="8" class="bar-cold"/>
  <text x="240" y="949.62" text-anchor="middle" class="small ink">0.253716 → 40.30℃</text>
  <text x="460" y="1091.60" text-anchor="middle" class="small ink">0.249904 → 39.99℃</text>
  <text x="680" y="1035.32" text-anchor="middle" class="small ink">0.250003 → 40.00℃</text>
  <text x="160" y="1043.38" class="small secondary">θ = 1/4</text>
  <text x="240" y="1128" text-anchor="middle" class="small ink">n = 1</text>
  <text x="460" y="1128" text-anchor="middle" class="small ink">n = 1, 3</text>
  <text x="680" y="1128" text-anchor="middle" class="small ink">n = 1, 3, 5</text>
  <text x="48" y="935" class="small secondary">縦軸は拡大（0.2485–0.2550）</text>
  <rect x="24" y="1167" width="792" height="140" rx="19" class="panel"/>
  <text x="48" y="1207" class="small ink">対称性：四辺 θ=1 の解は θ ≡ 1 → 一辺の寄与は中心で 1/4</text>
  <text x="48" y="1244" class="small ink">T_center = 20 + 80 × (1/4) = 40℃</text>
  <text x="48" y="1281" class="small secondary">内部温度の収束と角部の熱流の収束は別。角の不連続は理想化。</text>
  <text x="420" y="1375" text-anchor="middle" class="small secondary">アプリ作成の独自図・原書図版の転載ではない</text>
</svg>
