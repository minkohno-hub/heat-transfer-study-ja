<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1310" viewBox="0 0 900 1310" role="img" aria-labelledby="chf-title chf-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="9.3" data-rho-liquid="950.00" data-rho-vapor="0.60" data-sigma="0.059" data-gravity="9.81" data-latent-heat="2200000" data-correlation-coefficient="0.13" data-heat-rate="160000" data-area="0.20" data-capillary-length="0.002516905376" data-chf-model="1072591.176338033" data-average-operating-flux="800000.000000000" data-arithmetic-ratio="0.745857338423" data-arithmetic-margin="0.254142661577" data-chf-bar-width="620" data-operation-bar-width="462.431550" data-geometry="idealized-large-horizontal-pool" data-safety-verified="false">
<title id="chf-title">§9.3 限界熱流束：蒸気の排出と液体の補給、CHFモデルの限界</title>
<desc id="chf-desc">アプリ独自の模式図。大きな水平加熱面から上向きに蒸気が排出され、隣の領域から液体が面へ供給される競合を描く。これは仮説的機構の概念図であり、蒸気柱の間隔・直径・泡径の実寸は示さない。仮想飽和流体の密度は液体950、蒸気0.6キログラム毎立方メートル、表面張力0.059ニュートン毎メートル、潜熱2.2メガジュール毎キログラム、重力加速度9.81メートル毎秒毎秒。理想係数0.13の水平面CHF相関から約1.073メガワット毎平方メートルを計算する。毛管長の尺度は2.517ミリメートルだが、実際の気泡径ではない。液体に渡る熱160キロワット、有効面積0.20平方メートルから平均運転熱流束0.800メガワット毎平方メートルとなる。算術比は0.74586、差の比は0.25414。棒グラフは同一ゼロ基準・同一尺度の単純な数値比較であり、実機の安全余裕を保証しない。条件に適合する実測CHF、局所熱流束、幾何、表面、圧力、過渡制御、損失は未検証。</desc>
<style>
