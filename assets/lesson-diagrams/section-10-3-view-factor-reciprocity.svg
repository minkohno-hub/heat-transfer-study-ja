<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1100" viewBox="0 0 680 1100" role="img" aria-labelledby="vf-title vf-description" style="max-width:100%" data-lesson="10.3" data-origin="original-app-diagram" data-area-1="1" data-area-2="4" data-factor-12="0.8" data-temperature-1="400" data-temperature-2="300" data-sigma="5.67e-8">
  <title id="vf-title">§10.3 放射形態係数の相反則と二黒体の正味熱移動</title>
  <desc id="vf-description">アプリ独自作成の模式図。面1は面積1平方メートルで400ケルビン、面2は4平方メートルで300ケルビン。与えられた直接形態係数は面1から面2が0.80、逆向きが0.20。面積で重み付けすれば双方0.80平方メートルで一致する。両面を黒体、間の媒質を非参加性と仮定した正味の放射交換は面1から面2へ793.8ワット。図形の距離や大きさから形態係数を算出したものではない。</desc>
  <style>
    .bg{fill:#ffffff}.panel{fill:#f3f7fb;stroke:#bdcbd9;stroke-width:2}.ink{fill:#14283a}.muted{fill:#3e596d}.warm{fill:#a73c22}.cool{fill:#176a61}
    .surface-hot{fill:#d65d36;stroke:#8d361e;stroke-width:2}.surface-cold{fill:#368ba6;stroke:#1b6278;stroke-width:2}
    .rays{stroke:#74889b;stroke-width:2.5;stroke-dasharray:8 7;fill:none}.exchange{stroke:#176a61;stroke-width:6;fill:none}
    text{font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-size:25px}
    .title{font-size:34px;font-weight:700}.heading{font-size:28px;font-weight:700}.small{font-size:22px}.equation{font-size:26px;font-weight:600}
    @media (prefers-color-scheme:dark){.bg{fill:#101a27}.panel{fill:#192839;stroke:#60788e}.ink{fill:#eff6ff}.muted{fill:#c9d7e5}.warm{fill:#ffbb99}.cool{fill:#8be5d3}.surface-hot{fill:#a5482b;stroke:#ffb18c}.surface-cold{fill:#28617d;stroke:#85d3ef}.rays{stroke:#92a8be}.exchange{stroke:#8be5d3}}
  </style>
  <rect class="bg" x="0" y="0" width="680" height="1100"/>
  <text x="34" y="60" class="title ink">§10.3 放射形態係数の相反則</text>
  <text x="34" y="104" class="small muted">形態係数は「直接届く割合」、熱移動率ではない</text>

  <rect class="panel" x="24" y="130" width="632" height="420" rx="18"/>
  <text x="44" y="177" class="heading ink">① 面積が違う二つの黒体面</text>
  <text x="92" y="225" class="ink" text-anchor="middle">面1</text>
  <text x="92" y="263" class="small warm" text-anchor="middle">400 K</text>
  <text x="562" y="225" class="ink" text-anchor="middle">面2</text>
  <text x="562" y="263" class="small cool" text-anchor="middle">300 K</text>
  <rect x="185" y="287" width="26" height="94" rx="4" class="surface-hot"/>
  <rect x="469" y="262" width="26" height="144" rx="4" class="surface-cold"/>
  <path class="rays" d="M211 292 L469 275 M211 376 L469 391"/>
  <path class="exchange" d="M240 332 H438 M423 320 L439 332 L423 344"/>
  <text x="340" y="310" text-anchor="middle" class="small cool">正味 1 → 2</text>
  <text x="340" y="367" text-anchor="middle" class="small ink">793.8 W</text>
  <text x="124" y="429" text-anchor="middle" class="small ink">A_1 = 1.0 m²</text>
  <text x="550" y="429" text-anchor="middle" class="small ink">A_2 = 4.0 m²</text>
  <text x="44" y="470" class="small ink">与条件：F_12 = 0.80、F_21 = 0.20（無次元）</text>
  <text x="44" y="508" class="small muted">配置は模式図。係数は図形の寸法から算出しない。</text>

  <rect class="panel" x="24" y="567" width="632" height="224" rx="18"/>
  <text x="44" y="611" class="heading ink">② 形態係数の相反則</text>
  <text x="44" y="656" class="equation ink">A_1 F_12 = A_2 F_21</text>
  <text x="44" y="696" class="ink">1.0 × 0.80 = 0.80 m²</text>
  <text x="44" y="734" class="ink">4.0 × 0.20 = 0.80 m²</text>
  <text x="44" y="770" class="small muted">F_12 ≠ F_21 でも、面積を掛けた値は一致。</text>

  <rect class="panel" x="24" y="808" width="632" height="258" rx="18"/>
  <text x="44" y="852" class="heading ink">③ 黒体間の正味放射交換</text>
  <text x="44" y="897" class="equation ink">Qdot_12 = σ A_1 F_12 (T_1⁴ − T_2⁴)</text>
  <text x="44" y="935" class="small muted">σ = 5.67 × 10^(-8) W/(m²·K⁴)</text>
  <text x="44" y="972" class="small ink">= 5.67×10^(-8) × 1.0 × 0.80</text>
  <text x="64" y="1008" class="small ink">× (400⁴ − 300⁴) = 793.8 W</text>
  <text x="44" y="1045" class="small cool">高温の面1から低温の面2へ正味移動</text>
  <text x="340" y="1090" text-anchor="middle" class="small muted">アプリ作成の図｜黒体・非参加性媒質の例</text>
</svg>
