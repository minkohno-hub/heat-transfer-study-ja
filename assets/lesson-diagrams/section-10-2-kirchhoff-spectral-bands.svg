<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1156" viewBox="0 0 840 1156" style="max-width:100%" role="img" aria-labelledby="title10-2 desc10-2" data-lesson="10.2" data-origin="original-app-diagram" data-sigma="5.670374419e-8" data-tsun="5772" data-tbody="300" data-sun-l1="0.33" data-sun-l2="2.2" data-sun-frac="0.899576" data-body-l1="6.3" data-body-l2="42" data-body-frac="0.900647" data-qsolar="1000" data-black-alpha="0.94" data-black-eps="0.94" data-black-t="364.41569" data-white-alpha="0.15" data-white-eps="0.90" data-white-t="232.84089">
<title id="title10-2">§10.2 Kirchhoffの法則：放射率と吸収率は別々に決まる</title>
<desc id="desc10-2">アプリ独自作成の模式図。Kirchhoffの法則の3つの形（単色・方向の等式、拡散面の単色等式、灰色面での全量等式）を適用条件の強さの順に示す。太陽（5772ケルビン）の放射は0.33から2.2マイクロメートルに89.96パーセント、300ケルビンの物体の放射は6.3から42マイクロメートルに90.06パーセントが集中し、波長帯が分離している。日射1000ワット毎平方メートルを受け放射だけで釣り合う理想化では、黒ペイントは364.42ケルビン、白ペイントは232.84ケルビンになる。白ペイントの太陽吸収率は本書の範囲0.1から0.2の代表値0.15、赤外放射率は0.90とした。原著の図版の転載ではない。</desc>
<style>
text{font-family:system-ui,'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:23px}
.bg{fill:#ffffff}.panel{fill:#f4f7fa;stroke:#c2d1dd;stroke-width:2}.ink{fill:#173044}.muted{fill:#43596c}.warm{fill:#a84429}.cool{fill:#146b83}
.sunband{fill:#e8a13a}.bodyband{fill:#5396b4}.axis{stroke:#43596c;stroke-width:2}
.blacksw{fill:#2b2b2b;stroke:#111111;stroke-width:2}.whitesw{fill:#f7f7f2;stroke:#8a97a3;stroke-width:2}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:20px}.tiny{font-size:19px}.equation{font-size:23px;font-weight:650}
@media(prefers-color-scheme:dark){.bg{fill:#101b26}.panel{fill:#1d2d3d;stroke:#657d91}.ink{fill:#f1f7fb}.muted{fill:#c8d8e5}.warm{fill:#ffb599}.cool{fill:#8fdaef}.sunband{fill:#b97e22}.bodyband{fill:#2c6d88}.axis{stroke:#c8d8e5}.blacksw{fill:#454545;stroke:#cccccc}.whitesw{fill:#e8e8e0;stroke:#8a97a3}}
</style>
<rect class="bg" width="840" height="1156"/>
<text class="title ink" x="31" y="58">§10.2 Kirchhoffの法則と波長帯の分離</text>
<text class="small muted" x="33" y="97">ε は面とその温度で決まるが、α は放射源のスペクトルにも依存する</text>
<rect class="panel" x="23" y="119" width="794" height="252" rx="19"/>
<text class="section ink" x="43" y="161">① 法則の3つの形（下ほど仮定が強い）</text>
<text class="equation ink" x="43" y="205">ε_λ(T, θ, φ) = α_λ(T, θ, φ)　（10.8a）</text>
<text class="small muted" x="43" y="233">単色・方向ごと。周囲と熱平衡にある面で厳密</text>
<text class="equation ink" x="43" y="277">ε_λ(T) = α_λ(T)　（10.8b）</text>
<text class="small muted" x="43" y="305">拡散面では角度依存が消える</text>
<text class="equation warm" x="43" y="349">ε(T) = α(T)　（10.8c）：灰色面でのみ正確</text>
<rect class="panel" x="23" y="389" width="794" height="316" rx="19"/>
<text class="section ink" x="43" y="431">② 放射する帯と吸収する帯がずれる</text>
<text class="small ink" x="43" y="470">太陽 5772 K の放射（横軸は対数・模式）</text>
<rect class="sunband" x="184" y="486" width="198" height="34"/>
<line class="axis" x1="60" y1="486" x2="780" y2="486"/><line class="axis" x1="60" y1="520" x2="780" y2="520"/>
<text class="tiny ink" x="283" y="552" text-anchor="middle">0.33–2.2 μm に 89.96%</text>
<text class="small ink" x="43" y="592">物体 300 K の放射</text>
<rect class="bodyband" x="492" y="608" width="198" height="34"/>
<line class="axis" x1="60" y1="608" x2="780" y2="608"/><line class="axis" x1="60" y1="642" x2="780" y2="642"/>
<text class="tiny ink" x="591" y="674" text-anchor="middle">6.3–42 μm に 90.06%</text>
<text class="tiny muted" x="60" y="700">0.1 μm</text>
<text class="tiny muted" x="300" y="700" text-anchor="middle">1 μm</text>
<text class="tiny muted" x="540" y="700" text-anchor="middle">10 μm</text>
<text class="tiny muted" x="780" y="700" text-anchor="end">100 μm</text>
<rect class="panel" x="23" y="723" width="794" height="356" rx="19"/>
<text class="section ink" x="43" y="765">③ 同じ ε でも α_solar は全く違う</text>
<rect class="blacksw" x="43" y="788" width="52" height="52" rx="6"/>
<text class="small ink" x="112" y="809">黒ペイント： ε ≃ 0.94、α_solar ≃ 0.94</text>
<text class="small muted" x="112" y="837">帯が重なるため（10.8c）がほぼ成り立つ</text>
<rect class="whitesw" x="43" y="861" width="52" height="52" rx="6"/>
<text class="small ink" x="112" y="882">白ペイント： ε_IR ≃ 0.90、α_solar ≃ 0.15</text>
<text class="small muted" x="112" y="910">可視を80–90%反射するので（10.8c）は使えない</text>
<text class="equation ink" x="43" y="956">放射のみの釣合い α_solar·q_solar = ε_IR σT⁴</text>
<text class="small ink" x="43" y="992">q_solar = 1000 W/m² のとき黒 364.42 K（91.3 ℃）</text>
<text class="small cool" x="43" y="1026">白 232.84 K（−40.3 ℃）まで下がる（理想化）</text>
<text class="tiny muted" x="43" y="1068">α_solar 0.15 は本書の範囲 0.1–0.2 の代表値。対流のある実際の屋根は §10.6 例題10.12</text>
<text class="tiny muted" x="420" y="1138" text-anchor="middle">アプリ作成の独自模式図｜原著の図版・描画の転載なし</text>
</svg>
