<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1560" viewBox="0 0 760 1560" role="img" aria-labelledby="air-title air-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="11.2" data-m-n2="0.7552" data-m-o2="0.2314" data-m-ar="0.0128" data-molar-mass-n2="28.01" data-molar-mass-o2="32.00" data-molar-mass-ar="39.95" data-pressure-pa="101325" data-temperature-k="300" data-gas-constant-kmol="8314.5">
<title id="air-title">§11.2 組成と成分流束：乾燥空気の換算（例題11.1）</title>
<desc id="air-desc">アプリ独自作成の学習図。原書例題11.1の乾燥空気。質量分率は窒素0.7552、酸素0.2314、アルゴン0.0128、モル質量は28.01、32.00、39.95キログラム毎キロモルで、混合物のモル質量は28.97。換算したモル分率は窒素0.7812、酸素0.2095、アルゴン0.00928。酸素の分圧は2.123×10の4乗パスカル、モル濃度は8.510モル毎立方メートル、部分密度は0.2723キログラム毎立方メートル。全流束は全体流による輸送と拡散流束の和で、拡散流束の総和はゼロになる。図は模式図。</desc>
<style>
  .bg{fill:#fff}.panel{fill:#f4f7fb;stroke:#bdcad8;stroke-width:2}.ink{fill:#142b3f}.secondary{fill:#415b6f}.a{fill:#a43f24}.b{fill:#176f77}.solid{fill:#d5eaf4;stroke:#39728c;stroke-width:2}.a-stroke{stroke:#a43f24}.b-stroke{stroke:#176f77}.axis{stroke:#415b6f;stroke-width:2.5}.guide{stroke:#bac8d4;stroke-width:2;stroke-dasharray:6 6}.plot-a{fill:none;stroke:#a43f24;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.plot-b{fill:none;stroke:#176f77;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-a{fill:none;stroke:#a43f24;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-b{fill:none;stroke:#176f77;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow-ink{fill:none;stroke:#415b6f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shape{fill:none;stroke:#39728c;stroke-width:3}.marker-a{fill:#a43f24}.marker-b{fill:#176f77}
  text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:24px}.title{font-size:33px;font-weight:700}.heading{font-size:28px;font-weight:700}.small{font-size:21px}.equation{font-size:25px;font-weight:600}
  @media(prefers-color-scheme:dark){.bg{fill:#111b27}.panel{fill:#192a3a;stroke:#5b7891}.ink{fill:#eff6ff}.secondary{fill:#c4d7e4}.a{fill:#ffb494}.b{fill:#8fdfdf}.solid{fill:#23475e;stroke:#8ccde9}.a-stroke{stroke:#ffb494}.b-stroke{stroke:#8fdfdf}.axis{stroke:#c4d7e4}.guide{stroke:#617c91}.plot-a{stroke:#ffb494}.plot-b{stroke:#8fdfdf}.arrow-a{stroke:#ffb494}.arrow-b{stroke:#8fdfdf}.arrow-ink{stroke:#c4d7e4}.shape{stroke:#8ccde9}.marker-a{fill:#ffb494}.marker-b{fill:#8fdfdf}}
</style>
<rect class="bg" width="760" height="1560"/>
<text x="34" y="62" class="title ink">§11.2 組成と成分流束</text>
<text x="36" y="104" class="small secondary">質量分率・モル分率・分圧・濃度・部分密度は相互に換算できる</text>
<rect x="24" y="128" width="712" height="436" rx="18" class="panel"/>
<text x="46" y="173" class="heading ink">乾燥空気の組成（例題11.1）</text>
<text x="46" y="212" class="small secondary">質量分率 m_i（残りは微量ガス 0.001 未満）</text>
<text x="60" y="258" class="small ink">N_2</text>
<rect id="bar-m-n2" x="170" y="232" width="422.912" height="30" class="a"/>
<text x="604.9" y="258" class="small ink">0.7552</text>
<text x="60" y="308" class="small ink">O_2</text>
<rect id="bar-m-o2" x="170" y="282" width="129.584" height="30" class="a"/>
<text x="311.6" y="308" class="small ink">0.2314</text>
<text x="60" y="358" class="small ink">Ar</text>
<rect id="bar-m-ar" x="170" y="332" width="7.168" height="30" class="a"/>
<text x="189.2" y="358" class="small ink">0.0128</text>
<text x="46" y="404" class="small secondary">モル分率 x_i（質量分率とモル質量から換算）</text>
<text x="60" y="450" class="small ink">N_2</text>
<rect id="bar-x-n2" x="170" y="424" width="437.470" height="30" class="b"/>
<text x="619.5" y="450" class="small ink">0.7812</text>
<text x="60" y="500" class="small ink">O_2</text>
<rect id="bar-x-o2" x="170" y="474" width="117.331" height="30" class="b"/>
<text x="299.3" y="500" class="small ink">0.2095</text>
<text x="60" y="550" class="small ink">Ar</text>
<rect id="bar-x-ar" x="170" y="524" width="5.199" height="30" class="b"/>
<text x="187.2" y="550" class="small ink">0.0093</text>
<rect x="24" y="584" width="712" height="336" rx="18" class="panel"/>
<text x="46" y="631" class="heading ink">酸素だけを追う：x → p → c → ρ</text>
<text x="46" y="680" class="small ink">M = 28.97 kg/kmol（式(11.8)：1/M = Σ m_i/M_i）</text>
<text x="46" y="724" class="small ink">x_O2 = m_O2 M/M_O2 = 0.2095（式(11.9)）</text>
<text x="46" y="768" class="small ink">p_O2 = x_O2 p = 2.123×10^4 Pa（式(11.15)、p = 101325 Pa）</text>
<text x="46" y="812" class="small ink">c_O2 = p_O2/(R°T) = 8.510 mol/m³（式(11.12)、T = 300 K）</text>
<text x="46" y="856" class="small ink">ρ_O2 = c_O2 M_O2 = 0.2723 kg/m³（式(11.4)）</text>
<text x="46" y="896" class="small secondary">R° = 8314.5 J/(kmol·K)。Dalton の法則 p = Σ p_i（式(11.14)）</text>
<rect x="24" y="940" width="712" height="452" rx="18" class="panel"/>
<text x="46" y="987" class="heading ink">全流束 = 全体流の輸送 + 拡散</text>
<rect x="70" y="1030" width="300" height="150" rx="6" class="solid"/>
<path d="M92 1072 H330 M314 1059 L330 1072 L314 1085" class="arrow-ink"/>
<text x="92" y="1052" class="small ink">全体流 n = ρv</text>
<path d="M92 1118 H250 M234 1105 L250 1118 L234 1131" class="arrow-a"/>
<text x="258" y="1126" class="small a">A の拡散 j_A</text>
<path d="M330 1158 H172 M188 1145 L172 1158 L188 1171" class="arrow-b"/>
<text x="92" y="1150" class="small b">B の拡散 j_B</text>
<text x="400" y="1052" class="small ink">質量基準（式(11.20)）</text>
<text x="400" y="1096" class="equation ink">n_i = m_i n + j_i</text>
<text x="400" y="1140" class="small ink">Σ j_i = 0（式(11.21)）</text>
<text x="400" y="1184" class="small ink">Σ n_i = n（式(11.18)）</text>
<text x="46" y="1240" class="small ink">モル基準も同形：N_i = x_i N + J_i、Σ J_i = 0（式(11.24)(11.25)）</text>
<text x="46" y="1284" class="small ink">質量平均速度 v は、前章までの流体速度 u と同じもの</text>
<text x="46" y="1328" class="small secondary">拡散流束は平均速度に対する相対量。全流束と混同しない</text>
<text x="46" y="1372" class="small secondary">反応がある表面では各成分の流束が量論で結ばれる（例題11.2）</text>
<text x="380" y="1540" text-anchor="middle" class="small secondary">アプリ作成の独自図・模式図（原書図版ではない）</text>
</svg>
