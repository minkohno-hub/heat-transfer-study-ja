<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1180" viewBox="0 0 840 1180" style="max-width:100%" role="img" aria-labelledby="title71 desc71" data-origin="original-app-diagram" data-lesson="7.1" data-a="0.020" data-b="0.010" data-ac="0.0002" data-pw="0.060" data-dh="0.0133333333333333" data-ub="2.0" data-rho="1.2" data-mu="0.000018" data-qv="0.0004" data-mdot="0.00048" data-re="1777.7777777777778" data-length="0.50" data-l-over-dh="37.5" data-factor="0.05" data-entrance-ratio="88.8888888888889">
<title id="title71">§7.1 長方形ダクト：水力直径と発達の判定</title>
<desc id="desc71">アプリ独自作図。辺0.020メートルと0.010メートルの長方形ダクトで、断面積2.0×10⁻⁴平方メートル、濡れ周長0.060メートル、水力直径0.01333メートル。断面平均速度2.0メートル毎秒、密度1.2キログラム毎立方メートル、粘度1.8×10⁻⁵パスカル秒とすると、体積流量4.0×10⁻⁴立方メートル毎秒、質量流量4.8×10⁻⁴キログラム毎秒、水力直径基準レイノルズ数1778。長さ0.50メートルは水力直径の37.5倍で、層流円管の速度助走長の目安0.05Re＝88.9倍より短いため、十分発達とは即断できない。濡れ周長と加熱周長は別の定義である。</desc>
<style>
text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:23px}
.bg{fill:#fff}.panel{fill:#f4f7fb;stroke:#bfd0df;stroke-width:2}.ink{fill:#193148}.muted{fill:#476074}
.duct{fill:#dceaf3;stroke:#56809a;stroke-width:3}.dot{fill:#287da4}
.bar-len{fill:#287b9e}.bar-ent{fill:#b66837}.rest{fill:#b6cbd9}.guide{stroke:#647b8e;stroke-width:1.7;stroke-dasharray:5 7}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:21px}.micro{font-size:18px}.formula{font-size:25px;font-weight:650}
@media(prefers-color-scheme:dark){.bg{fill:#111b26}.panel{fill:#1c2b3b;stroke:#617c91}.ink{fill:#edf6fe}.muted{fill:#c6d8e5}.duct{fill:#26475e;stroke:#9ac5de}.dot{fill:#9fdaf7}.bar-len{fill:#3688ac}.bar-ent{fill:#ad6d47}.rest{fill:#576d7e}.guide{stroke:#8198ac}}
</style>
<rect class="bg" width="840" height="1180"/>
<text x="30" y="59" class="title ink">§7.1 長方形ダクトの水力直径</text>
<text x="31" y="100" class="small muted">断面の定義から Re までそろえ、円管の値を流用しない</text>
<rect class="panel" x="24" y="122" width="792" height="360" rx="18"/>
<text x="44" y="164" class="section ink">① 断面と二つの周長</text>
<rect class="duct" x="280" y="206" width="280" height="140"/>
<circle class="dot" cx="350" cy="252" r="7"/><circle class="dot" cx="420" cy="252" r="7"/><circle class="dot" cx="490" cy="252" r="7"/>
<circle class="dot" cx="350" cy="300" r="7"/><circle class="dot" cx="420" cy="300" r="7"/><circle class="dot" cx="490" cy="300" r="7"/>
<text x="420" y="194" text-anchor="middle" class="small ink">a = 0.020 m</text>
<text x="266" y="284" text-anchor="end" class="small ink">b = 0.010 m</text>
<text x="574" y="284" class="small muted">流れは紙面手前</text>
<text x="45" y="392" class="small ink">A_c = a × b = 2.0×10⁻⁴ m²、P_w = 2(a+b) = 0.060 m</text>
<text x="45" y="428" class="small ink">D_h = 4A_c / P_w = 0.01333 m（対角線でも幅でもない）</text>
<text x="45" y="464" class="micro muted">濡れ周長 P_w と加熱周長 P_h は別定義（本例は全壁が濡れている）</text>
<rect class="panel" x="24" y="500" width="792" height="196" rx="18"/>
<text x="44" y="544" class="section ink">② 流量・質量流量・Re</text>
<text x="45" y="588" class="small ink">U_b = 2.0 m/s、ρ = 1.2 kg/m³、μ = 1.8×10⁻⁵ Pa·s</text>
<text x="45" y="624" class="small ink">q_v = U_b A_c = 4.0×10⁻⁴ m³/s、ṁ = ρ q_v = 4.8×10⁻⁴ kg/s</text>
<text x="45" y="664" class="formula ink">Re_Dh = ρ U_b D_h / μ = 1778</text>
<rect class="panel" x="24" y="714" width="792" height="330" rx="18"/>
<text x="44" y="758" class="section ink">③ 長さ 0.50 m で十分発達と言えるか</text>
<text x="46" y="836" class="small ink">管の長さ</text>
<text x="46" y="906" class="small ink">助走長の目安</text>
<rect id="len-bar" class="bar-len" x="166" y="806" width="207" height="34" rx="3"/>
<rect id="len-rest" class="rest" x="373" y="806" width="345" height="34" rx="3"/>
<rect id="ent-bar" class="bar-ent" x="166" y="876" width="490.67" height="34" rx="3"/>
<rect id="ent-rest" class="rest" x="656.67" y="876" width="61.33" height="34" rx="3"/>
<path class="guide" d="M373 790 V928 M656.67 790 V928"/>
<text x="166" y="958" text-anchor="middle" class="micro ink">0</text>
<text x="373" y="958" text-anchor="middle" class="micro ink">37.5</text>
<text x="656.67" y="958" text-anchor="middle" class="micro ink">88.9</text>
<text x="718" y="958" text-anchor="middle" class="micro ink">100</text>
<text x="45" y="998" class="small ink">横軸は L / D_h。37.5 ＜ 88.9 なので、</text>
<text x="45" y="1030" class="small ink">円管の目安でも十分発達とは即断できない</text>
<text x="420" y="1132" text-anchor="middle" class="micro muted">アプリ作成の独自模式図｜原著図版の転載・翻訳なし</text>
</svg>
