<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1520" viewBox="0 0 760 1520" role="img" aria-labelledby="film-title film-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="11.8" data-gm-star="0.04" data-density-kg-m3="998" data-flux-1-l-m2h="15" data-flux-2-l-m2h="35" data-salt-bulk="0.035" data-bm-ro="-0.217">
<title id="film-title">§11.8 クエット・停滞膜モデル：吹き出し因子と濃度分極</title>
<desc id="film-desc">アプリ独自作成の学習図。静止膜モデルでは低移動率係数に吹き出し因子 ln(1+B_m)/B_m を掛けて高移動率へ補正する。吹き出しでは因子は1未満、吸い込みでは1より大きい。逆浸透の例題11.15では低移動率係数0.04、水流束15と35リットル毎平方メートル時で濃度分極は約10.9パーセントと約27.5パーセントになり、膜面の塩質量分率は3.5パーセントから3.88、4.46パーセントへ上がる。図は模式図。</desc>
