<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1180" viewBox="0 0 820 1180" style="max-width:100%" role="img" aria-labelledby="title62 desc62" data-lesson="6.2" data-origin="original-app-diagram" data-uinf="2" data-length="0.5" data-width="0.2" data-nu="0.000015" data-rho="1.2" data-fpp0="0.332057" data-re-l="66666.6666666667" data-delta99-l="0.00968245836552" data-cf-local-l="0.00257166094188" data-tau-w-l="0.00617198626052" data-cf-avg="0.00514332188376" data-drag="0.0012343972521">
<title id="title62">§6.2 Blasius相似解：速度分布・層厚・摩擦</title>
<desc id="desc62">アプリ独自の図。平滑平板上の層流境界層について、Blasius相似解の速度分布u/Uを壁からの距離に対して示し、99パーセント厚さが約9.68ミリメートルであること、層厚が下流へ平方根で成長すること、局所摩擦係数0.00257166、壁面せん断応力0.00617199パスカル、平均摩擦係数は局所値の2倍の0.00514332、片面の摩擦抗力0.00123440ニュートンを示す。主流速度2メートル毎秒、長さ0.5メートル、幅0.2メートル、動粘度1.5掛ける10のマイナス5乗、密度1.2での独立計算。</desc>
