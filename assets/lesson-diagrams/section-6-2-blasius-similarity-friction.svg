<rect class="panel" x="23" y="828" width="774" height="252" rx="19"/>
<text class="section ink" x="44" y="872">③ 摩擦（原書 6.32〜6.34）</text>
<text class="result ink" x="43" y="916">Re_L = 6.67×10^4、C_f,L = 0.664/√Re_L ≈ 0.002572</text>
<text class="result ink" x="43" y="954">τ_w(L) ≈ 0.00617 Pa、平均 C̄_f,L = 1.328/√Re_L ≈ 0.005143</text>
<text class="result ink" x="43" y="992">片面の摩擦抗力 D_f ≈ 1.23×10^(-3) N（平均は末端局所値の2倍）</text>
<text class="micro muted" x="43" y="1036">圧力抵抗・両面・前縁形状の抵抗は含まない。遷移 Re≈5×10^5 は目安</text>
<text class="micro muted" x="410" y="1148" text-anchor="middle">アプリ作成の独自模式図｜非実寸・原著図版の転載なし</text>
