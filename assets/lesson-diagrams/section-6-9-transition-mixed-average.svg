<rect class="bg" width="820" height="1160"/>
<text class="heading ink" x="32" y="59">§6.9 遷移と全体熱伝達</text>
<text class="small muted" x="33" y="101">末端が乱流でも、前半の層流の履歴が平均を下げる</text>
<rect class="panel" x="23" y="124" width="774" height="252" rx="19"/>
<text class="section ink" x="44" y="168">① 区間の分け方（急切替の近似）</text>
<rect id="seg-lam" class="barA" x="110" y="196" width="300" height="44"/>
<rect id="seg-turb" class="barB" x="410" y="196" width="300" height="44"/>
<text class="small ink" x="150" y="272">層流 0〜0.50 m</text>
<text class="small ink" x="450" y="272">乱流 0.50〜1.0 m</text>
<text class="small muted" x="43" y="306">切替は Re_c = 5×10^5（目安）の位置 x_c = 0.50 m。</text>
<text class="small muted" x="43" y="332">実際の遷移は有限の幅を持つ</text>
<text class="small muted" x="43" y="358">Re_c は主流乱れ・粗さ・圧力勾配で変わり、普遍定数ではない</text>
<rect class="panel" x="23" y="394" width="774" height="290" rx="19"/>
<text class="section ink" x="44" y="438">② 補正 C′ は Pr 依存（気体の場合）</text>
<text class="result ink" x="43" y="482">C′ = 0.037 Re_c^0.8 Pr^0.6 − 0.664 Re_c^(1/2) Pr^(1/3)</text>
<text class="result ink" x="43" y="520">= 1082.52 − 416.89 ≈ 665.63（Re_c = 5×10^5、Pr = 0.7）</text>
<text class="small ink" x="43" y="562">層流部と乱流部で Pr の指数が違うため、C′ を Pr^(1/3) で括り出せない</text>
<text class="small muted" x="43" y="588">C′ は Re_c と Pr の両方で変わる。</text>
<text class="small muted" x="43" y="614">条件が違えば 871 のような別の値になり、固定しない</text>
<text class="small muted" x="43" y="642">Re_L ≤ Re_c なら混合式を使わず、層流の平均相関を使う</text>
<text class="small muted" x="43" y="670">検算：Re_L = Re_c では補正式は層流平均 416.89 と一致する</text>
<rect class="panel" x="23" y="702" width="774" height="330" rx="19"/>
<text class="section ink" x="44" y="746">③ 平均 Nū_L の比較と熱流</text>
<text class="small ink" x="43" y="792">遷移あり（区間積分）→ 1219.1</text>
<rect id="bar-mixed" class="barA" x="43" y="806" width="292.6" height="30"/>
<text class="small ink" x="43" y="870">前縁から全て乱流 → 1884.8</text>
<rect id="bar-turb" class="barB" x="43" y="884" width="452.35" height="30"/>
<text class="result ink" x="43" y="952">h̄_L ≈ 31.70 W/(m²·K)、片面 Q̇ ≈ 253.6 W（ΔT = 40 K）</text>
<text class="small muted" x="43" y="990">原書の3域統合は （6.117）〜（6.120）。本図は急切替近似の教材モデル</text>
<text class="micro muted" x="410" y="1128" text-anchor="middle">アプリ作成の独自模式図｜非実寸・原著図版の転載なし</text>
</svg>
