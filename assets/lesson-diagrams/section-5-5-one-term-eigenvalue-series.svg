  <title id="oneterm-title">§5.5 一項近似：固有値・係数・境界条件で精度を考える</title>
  <desc id="oneterm-desc">アプリ作成の独自図解。両面対流平板でBiイコール1のとき、固有値条件ラムダ・タンジェント・ラムダ・イコールBiの最小根は0.860333589、係数A1は1.119132008。Foイコール0.5では一項近似の中心の無次元温度は0.772955693で中心81.84度、半分の位置で76.20度、平均74.49度。級数の全項と一項近似はFoが0.2を超えるとほぼ重なり、短時間では一項をtイコール0へ外挿するとA1が1を超える限界も示す。</desc>
