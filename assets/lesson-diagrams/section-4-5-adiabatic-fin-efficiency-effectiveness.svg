<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1360" viewBox="0 0 840 1360" style="max-width:100%" role="img" aria-labelledby="fin-title fin-description" data-origin="original-app-diagram" data-lesson="4.5" data-k-solid="200" data-h="25" data-perimeter="0.040" data-cross-section="0.0001" data-length="0.100" data-base-temperature="80" data-ambient-temperature="20" data-m-parameter="7.071067811865" data-m-l="0.707106781187" data-base-heat="5.166343029483" data-ideal-side-heat="6.000000000000" data-unfinned-heat="0.150000000000" data-efficiency="0.861057171581" data-effectiveness="34.442286863222" data-tip-temperature="67.596690904783" data-curve-points="41" data-tip-condition="adiabatic">
<title id="fin-title">§4.5 断熱先端フィンの温度分布とフィン効率・有効度</title>
<desc id="fin-description">アプリ独自図解。一定断面、一定物性、一次元定常伝導、側面から周囲20℃への対流、基部80℃、先端断熱の直線フィン。基部から先端へ温度が連続的に下がり、先端で温度勾配はゼロになる。全長0.100メートル、固体熱伝導率200ワット毎メートルケルビン、側面熱伝達率25ワット毎平方メートルケルビン、周長0.040メートル、断面積0.0001平方メートル。mは約7.0711毎メートル、mLは約0.7071。基部放熱は5.166ワット。側面全体が基部温度という仮想最大放熱6.000ワットに対するフィン効率は約86.1パーセント。フィンを取り付けず断面積が流体に露出した場合の0.150ワットを基準にしたフィン有効度は約34.44で、効率とは異なる。先端温度は約67.60℃。温度分布は解析式の41点で作成した模式グラフで、放射、接触抵抗、先端対流、内部発熱と二次元伝導を含めない。先端断熱は側面対流がないことを意味しない。</desc>
