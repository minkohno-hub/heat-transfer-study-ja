<text x="30" y="57" class="heading ink">§4.5 フィン効率と有効度は違う</text>
<text x="31" y="98" class="small muted">断熱先端・一様断面の直線フィンを考える</text>

<rect class="panel" x="23" y="118" width="794" height="331" rx="18"/>
<text x="44" y="162" class="section ink">① 基部から伝導、側面から対流で放熱</text>
<rect id="base-block" class="base" x="106" y="206" width="50" height="149" rx="4"/>
<rect id="fin-body" class="fin" x="156" y="256" width="504" height="49" rx="3"/>
<path class="flow" d="M240 249 V217 M229 229 L240 217 L251 229 M365 249 V217 M354 229 L365 217 L376 229 M490 249 V217 M479 229 L490 217 L501 229"/>
<path class="flow" d="M240 310 V342 M229 330 L240 342 L251 330 M365 310 V342 M354 330 L365 342 L376 330 M490 310 V342 M479 330 L490 342 L501 330"/>
<path class="axis" d="M661 250 V311 M668 250 V311 M675 250 V311"/>
<text x="105" y="389" class="small ink">基部 T_b = 80 ℃</text>
<text x="478" y="389" class="small ink">先端：断熱（dT/dx = 0）</text>
<text x="181" y="422" class="micro muted">横方向 x：0 → L = 0.100 m ／ 周囲 T∞ = 20 ℃</text>

<rect class="panel" x="23" y="464" width="794" height="451" rx="18"/>
<text x="44" y="508" class="section ink">② 温度差の比は先端へ向かって低下</text>
<text x="44" y="533" class="micro muted">θ(x)/θ_b = cosh[m(L−x)]/cosh(mL)</text>
