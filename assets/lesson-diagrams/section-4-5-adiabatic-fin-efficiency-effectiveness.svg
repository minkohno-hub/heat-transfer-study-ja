<text x="126" y="550" text-anchor="end" class="micro ink">1.00</text>
<text x="126" y="652" text-anchor="end" class="micro ink">0.90</text>
<text x="126" y="755" text-anchor="end" class="micro ink">0.80</text>
<text x="126" y="807" text-anchor="end" class="micro ink">0.75</text>
<text x="145" y="830" text-anchor="middle" class="micro ink">0</text>
<text x="419" y="830" text-anchor="middle" class="micro ink">0.5</text>
<text x="693" y="830" text-anchor="middle" class="micro ink">1.0</text>
<text x="419" y="861" text-anchor="middle" class="micro muted">基部からの位置 x/L →</text>
<text x="43" y="897" class="micro muted">先端温度 ≈ 67.60 ℃。先端で曲線の勾配は0。</text>

<rect class="panel" x="23" y="933" width="794" height="361" rx="18"/>
<text x="44" y="974" class="section ink">③ 何を基準に比べるかが違う</text>
<text x="44" y="1009" class="small ink">基部放熱 q_b ≈ 5.166 W</text>
<text x="44" y="1042" class="small muted">側面が全て基部温度なら 6.000 W（理想上限）</text>
<rect id="ideal-side-bar" class="barIdeal" x="45" y="1060" width="610" height="18" rx="3"/>
<rect id="real-side-bar" class="barActual" x="45" y="1082" width="525.244875" height="18" rx="3"/>
<text x="44" y="1133" class="equation ink">効率 η_f = 5.166/6.000 ≈ 86.1%</text>
<text x="44" y="1168" class="small muted">フィンなし：基部断面 A_c からの対流は 0.150 W</text>
<text x="44" y="1201" class="equation ink">有効度 ε_f = 5.166/0.150 ≈ 34.44</text>
<text x="44" y="1265" class="micro muted">一定 h・k、定常、放射・接触抵抗・先端対流なし。</text>
<text x="420" y="1335" text-anchor="middle" class="micro muted">アプリ独自作図｜原著図版の転載・トレース・逐文訳なし</text>
</svg>