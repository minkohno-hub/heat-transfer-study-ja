<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1280" viewBox="0 0 840 1280" role="img" aria-labelledby="scope-title scope-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="8.1" data-beta="0.00329869701468" data-dt="20" data-length="0.5" data-nu="1.6e-05" data-alpha="2.2e-05" data-velocity="2" data-gr="316017751.113" data-pr="0.727272727273" data-ra="229831091.719" data-re="62500" data-ri="0.080900544285" data-beta-dt="0.0659739402936" data-model="dimensionless-scale-comparison">
<title id="scope-title">§8.1 自然対流と膜状凝縮の対象範囲：流れを生む力</title>
<desc id="scope-desc">アプリが独自に作図した模式図。第8章では、駆動力が流体内部に働く浮力である自然対流、外部から与えられる強制対流、その両方が働く混合対流、そして冷壁にできた液膜が重力で流下する膜状凝縮を見分ける。仮想の垂直温壁（高さ0.50メートル、温度差20ケルビン）ではグラスホフ数が約3.16かける10の8乗、レイリー数が約2.30かける10の8乗となり、同方向の主流2.0メートル毎秒を重ねるとリチャードソン数は約0.0809で、浮力が強制慣性より小さい尺度になる。ただしこの数値だけで混合対流の効果をゼロとは判定しない。</desc>
<style>
