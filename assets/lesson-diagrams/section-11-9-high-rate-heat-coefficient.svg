<rect class="bg" width="760" height="1520"/>
<text x="34" y="62" class="title ink">§11.9 高い物質移動率での熱伝達</text>
<text x="36" y="104" class="small secondary">質量移動は物質側だけでなく熱伝達係数 h も増減させる</text>
<rect x="24" y="128" width="712" height="302" rx="18" class="panel"/>
<text x="46" y="173" class="heading ink">蒸散冷却：多孔質壁からの吹き出し</text>
<text x="60" y="216" class="small ink">高温ガス T_e</text>
<path d="M150 226 V286 M139 272 L150 288 L161 272" class="arrow-a"/>
<path d="M260 226 V286 M249 272 L260 288 L271 272" class="arrow-a"/>
<path d="M370 226 V286 M359 272 L370 288 L381 272" class="arrow-a"/>
<rect x="90" y="300" width="420" height="26" class="solid"/>
<circle cx="130" cy="313" r="3.5" class="marker-b"/>
<circle cx="190" cy="313" r="3.5" class="marker-b"/>
<circle cx="250" cy="313" r="3.5" class="marker-b"/>
<circle cx="310" cy="313" r="3.5" class="marker-b"/>
<circle cx="370" cy="313" r="3.5" class="marker-b"/>
<circle cx="430" cy="313" r="3.5" class="marker-b"/>
