<text x="530" y="240" class="small ink">境界層が厚くなり</text>
<text x="530" y="278" class="small ink">h が下がる</text>
<text x="530" y="330" class="small b">冷却ガスが</text>
<text x="530" y="368" class="small b">吹き出す</text>
<text x="90" y="404" class="small ink">多孔質壁（冷却材は貯蔵温度 T_r）で q_s = q_u（式(11.93)）</text>
<rect x="24" y="450" width="712" height="492" rx="18" class="panel"/>
<text x="46" y="497" class="heading ink">補正比 h/h*（式(11.88)、h* は質量移動ゼロの極限）</text>
