<text x="400" y="916" text-anchor="middle" class="small secondary">X = n_i,s c_p,i / h* →（正が吹き出し）</text>
<rect x="24" y="962" width="712" height="476" rx="18" class="panel"/>
<text x="46" y="1009" class="heading ink">壁温は貯蔵温度へ指数的に近づく（式(11.98)）</text>
<text x="46" y="1054" class="small ink">仮想例：T_e = 1200 K、T_r = 300 K、T_s − T_r の棒</text>
<text x="46" y="1108" class="small ink">X = 0.5</text>
<rect id="bar-ts-x0p5" x="150" y="1082" width="409.408" height="30" class="b"/>
