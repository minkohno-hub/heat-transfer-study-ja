<rect id="bar-ts-x3p0" x="150" y="1226" width="33.606" height="30" class="b"/>
<text x="195.6" y="1252" class="small ink">T_s = 344.8 K</text>
<text x="46" y="1300" class="small ink">発汗冷却：q_s = q_u + h_fg n_i,s（式(11.100) の形）</text>
<text x="46" y="1344" class="small ink">潜熱は顕熱よりはるかに大きく単位質量あたりの効率が高い</text>
<text x="46" y="1388" class="small secondary">応用：再突入体のアブレーション、非凝縮ガス混入の凝縮器</text>
<text x="46" y="1424" class="small secondary">|X| ≲ 0.2 では h は h* の約10%以内。物性は膜温度・膜組成で評価する</text>
<text x="380" y="1500" text-anchor="middle" class="small secondary">アプリ作成の独自図・模式図（原書図版ではない）</text>
