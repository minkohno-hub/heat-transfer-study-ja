<text x="46" y="1156" class="small ink">X = 1.0</text>
<rect id="bar-ts-x1p0" x="150" y="1130" width="248.319" height="30" class="b"/>
<text x="410.3" y="1156" class="small ink">T_s = 631.1 K</text>
<text x="46" y="1204" class="small ink">X = 2.0</text>
<rect id="bar-ts-x2p0" x="150" y="1178" width="91.351" height="30" class="b"/>
