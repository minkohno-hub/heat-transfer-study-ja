<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1520" viewBox="0 0 760 1520" role="img" aria-labelledby="high-title high-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="11.9" data-t-external-k="1200" data-t-reservoir-k="300">
<title id="high-title">§11.9 高い物質移動率での熱伝達：吹き出しが h を下げる</title>
<desc id="high-desc">アプリ独自作成の学習図。壁面の質量移動は熱伝達係数も変える。クエットモデルでは比 h/h* は X/(exp(X)−1)、X は質量流束×比熱÷h* で、吹き出しで1未満、吸い込みで1より大きくなる。蒸散冷却では壁温が貯蔵温度へ指数的に近づき、仮想例では外部1200ケルビン、貯蔵300ケルビンで X が0.5、1、2、3のとき壁温は845.9、631.1、421.8、344.8ケルビン。発汗冷却では潜熱の項が加わる。図は模式図。</desc>
