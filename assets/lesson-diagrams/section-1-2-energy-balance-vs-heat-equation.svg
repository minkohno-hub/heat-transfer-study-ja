 .solid{fill:#d3e5ef;stroke:#53819d;stroke-width:2.5} .heater{fill:#edb885;stroke:#a96029;stroke-width:2.5} .ambient{fill:#d5e9e6;stroke:#579384;stroke-width:2.5}
 .in{stroke:#b66531;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round} .out{stroke:#428d84;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
