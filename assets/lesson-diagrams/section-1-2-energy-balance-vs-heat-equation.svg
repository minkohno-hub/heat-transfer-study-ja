<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1350" viewBox="0 0 880 1350" role="img" aria-labelledby="heating-title heating-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="1.2" data-mass-kg="2.0" data-heat-capacity-j-kg-k="500" data-t-in-c="20" data-t-target-c="30" data-heater-power-w="200" data-loss-power-w="50" data-capacity-j-k="1000" data-net-power-w="150" data-stored-energy-j="10000" data-heating-time-s="66.666666666667" data-no-loss-time-s="50.000000000000" data-graph-points="41" data-curve-time-range="75" data-curve-temp-range="20,36" data-heating-model="lumped-fixed-power-fixed-loss" data-local-equation-model="constant-properties-conduction">
<title id="heating-title">§1.2 第一法則・熱移動率・熱伝導方程式：何が決まるかを区別する</title>
<desc id="heating-desc">独自作図。2キログラム、比熱500ジュール毎キログラム毎ケルビンの金属塊を20度から30度へ加熱する。一定のヒーター入力200ワット、周囲への損失50ワットとすると、熱容量1000ジュール毎ケルビン、蓄積速度150ワット、必要内部エネルギー増分10000ジュール、所要時間66.67秒。損失ゼロの場合は50秒。温度の時間変化を41点ずつ2曲線で比較する。閉じた系で仕事とその他の入出を無視するという条件を示す。保存則だけではヒーター入力や損失速度が求まらないため、熱移動の構成則と境界条件が別に必要。下段は別モデルとして、一次元・一定熱伝導率・物性の固体で局所の熱伝導方程式が保存則とFourier則を連立して導かれることを示す。上段の一様温度モデルと、下段の内部温度分布を解く偏微分方程式は同一の近似ではない。実装値は仮想の学習用数値であり、実機安全設計には使えない。</desc>
<style>
 text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:22px}
 .bg{fill:#fff} .panel{fill:#f3f7fa;stroke:#c6d5df;stroke-width:2} .ink{fill:#162f43} .muted{fill:#486476}
