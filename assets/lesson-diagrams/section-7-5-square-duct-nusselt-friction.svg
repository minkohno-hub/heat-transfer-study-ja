<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1210" viewBox="0 0 840 1210" style="max-width:100%" role="img" aria-labelledby="title75 desc75" data-origin="original-app-diagram" data-lesson="7.5" data-a="0.010" data-ac="0.0001" data-pw="0.040" data-dh="0.010" data-rho="1000" data-mu="0.001" data-ub="0.10" data-kf="0.60" data-re="1000" data-nu-tw="2.98" data-nu-qw="3.61" data-nu-circle="3.66" data-h="178.8" data-h-circle="219.6" data-dt="20" data-qflux="3576" data-qprime="143.04" data-fre="56.91" data-fre-circle="64" data-f="0.05691" data-length="5.0" data-dp="142.275" data-dp-circle="160.0">
<title id="title75">§7.5 正方形ダクト：形状で変わるヌセルト数と摩擦定数</title>
<desc id="desc75">アプリ独自作図。一辺0.010メートルの正方形ダクトで、断面積1.0×10⁻⁴平方メートル、濡れ周長0.040メートル、水力直径0.010メートル、レイノルズ数1000の十分発達層流。原書Table 7.4では、正方形のヌセルト数は壁温一定で2.98、熱流束条件で3.61、円管の壁温一定は3.66であり、水力直径が同じでも一致しない。熱伝達率は178.8ワット毎平方メートルケルビンで、温度差20ケルビンの評価断面では平均熱流束3576ワット毎平方メートル、単位長さ入熱143.04ワット毎メートル。摩擦定数fReは正方形で56.91、円管で64、長さ5.0メートルの摩擦圧力損失は142.3パスカル。</desc>
<style>
text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:23px}
.bg{fill:#fff}.panel{fill:#f4f7fb;stroke:#bfd0df;stroke-width:2}.ink{fill:#193148}.muted{fill:#476074}
.duct{fill:#dceaf3;stroke:#56809a;stroke-width:3}
.sq{fill:#287b9e}.qw{fill:#4d9e6b}.ci{fill:#b6cbd9}.fr{fill:#b66837}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:21px}.micro{font-size:18px}.formula{font-size:25px;font-weight:650}
@media(prefers-color-scheme:dark){.bg{fill:#111b26}.panel{fill:#1c2b3b;stroke:#617c91}.ink{fill:#edf6fe}.muted{fill:#c6d8e5}.duct{fill:#26475e;stroke:#9ac5de}.sq{fill:#3688ac}.qw{fill:#5fae7d}.ci{fill:#576d7e}.fr{fill:#ad6d47}}
</style>
<rect class="bg" width="840" height="1210"/>
<text x="30" y="59" class="title ink">§7.5 正方形ダクトの Nu と摩擦</text>
<text x="31" y="100" class="small muted">D_h が同じでも、層流の Nu と f_D Re は断面と境界条件で決まる</text>
<rect class="panel" x="24" y="122" width="792" height="330" rx="18"/>
<text x="44" y="164" class="section ink">① 断面と幾何</text>
<rect class="duct" x="330" y="196" width="180" height="180"/>
<text x="420" y="186" text-anchor="middle" class="small ink">a = 0.010 m</text>
<text x="316" y="294" text-anchor="end" class="small ink">a</text>
<text x="45" y="404" class="small ink">A_c = a² = 1.0×10⁻⁴ m²、P_w = 4a = 0.040 m</text>
<text x="45" y="436" class="small ink">D_h = 4A_c / P_w = 0.010 m、Re_Dh = 1000（層流）</text>
<rect class="panel" x="24" y="470" width="792" height="330" rx="18"/>
<text x="44" y="514" class="section ink">② 十分発達層流の Nu（原書 Table 7.4）</text>
<text x="45" y="570" class="small ink">正方形・壁温一定</text>
<rect id="nu-sq-tw" class="sq" x="330" y="548" width="223.5" height="28" rx="3"/>
<text x="565.5" y="570" class="small ink">2.98</text>
<text x="45" y="640" class="small ink">正方形・熱流束条件</text>
<rect id="nu-sq-qw" class="qw" x="330" y="618" width="270.75" height="28" rx="3"/>
<text x="612.75" y="640" class="small ink">3.61</text>
<text x="45" y="710" class="small ink">円管・壁温一定</text>
<rect id="nu-ci-tw" class="ci" x="330" y="688" width="274.5" height="28" rx="3"/>
<text x="616.5" y="710" class="small ink">3.66</text>
<text x="45" y="756" class="small ink">h = Nu k_f / D_h：正方形・壁温一定では 178.8 W/(m²·K)</text>
<text x="45" y="786" class="micro muted">熱流束条件の 3.61 は「単位長さ入熱一定・周方向壁温一様」の値。円管なら h = 219.6。</text>
<rect class="panel" x="24" y="818" width="792" height="310" rx="18"/>
<text x="44" y="862" class="section ink">③ 評価断面の熱流と摩擦</text>
<text x="45" y="904" class="small ink">評価断面（T_s − T_b = 20 K）：q̄″ = h ΔT = 3576 W/m²、q′ = 143.04 W/m</text>
<text x="45" y="936" class="micro muted">q′ は評価断面の局所値。全長へそのまま掛けない。</text>
<text x="45" y="978" class="small ink">摩擦の定数 f_D Re（Darcy、十分発達層流）</text>
<text x="45" y="1012" class="small ink">正方形</text>
<rect id="fre-sq" class="fr" x="330" y="990" width="227.64" height="26" rx="3"/>
<text x="569.64" y="1012" class="small ink">56.91</text>
<text x="45" y="1060" class="small ink">円管</text>
<rect id="fre-ci" class="fr" x="330" y="1038" width="256" height="26" rx="3"/>
<text x="598" y="1060" class="small ink">64</text>
<text x="45" y="1100" class="small ink">Δp_f（発達区間 L = 5.0 m）= 142.3 Pa（円管の定数では 160.0 Pa）</text>
<text x="420" y="1168" text-anchor="middle" class="micro muted">アプリ作成の独自模式図｜原著図版の転載・翻訳なし</text>
</svg>
