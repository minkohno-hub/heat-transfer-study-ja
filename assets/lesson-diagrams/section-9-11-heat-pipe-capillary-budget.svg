<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1280" viewBox="0 0 840 1280" role="img" aria-labelledby="pipe-title pipe-desc" style="max-width:100%" data-origin="original-app-diagram" data-lesson="9.11" data-q-load="200" data-h-fg="1000000" data-mass-rate="0.0002" data-sigma="0.04" data-r-eff="2e-05" data-dp-cap="4000" data-dp-liquid="1500" data-dp-vapor="500" data-dp-gravity="800" data-dp-margin="1200" data-a-liquid="125" data-a-vapor="0.0994718394324" data-q-cap-candidate="25.5796443658" data-q-ent-candidate="317.906824505" data-q-evap-candidate="50" data-merit="32000000000" data-model="capillary-pressure-budget">
<title id="pipe-title">§9.11 ヒートパイプ：潜熱循環と毛管圧力収支・作動限界</title>
<desc id="pipe-desc">アプリが独自に作図した模式図。ヒートパイプは、蒸発部で液体が蒸発し、蒸気が凝縮部へ流れ、凝縮液がウィックの毛管作用で戻る循環により、ほぼ等温で熱を運ぶ。仮想例では熱負荷200ワットに対する潜熱循環は約0.20グラム毎秒、利用可能な毛管圧力4000パスカルに対し、液体損失1500、蒸気損失500、重力項800の合計2800パスカルが必要で、余裕は1200パスカルである。別の輸送区間モデルでは、毛管上限の候補約25.6ワット、蒸発面の候補50.0ワット、同伴の候補約318ワットと、限界の候補は別々に評価される。</desc>
<style>
text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:22px}
.bg{fill:#fff}.panel{fill:#f4f8fb;stroke:#c2d1de;stroke-width:2}.ink{fill:#1b3247}.muted{fill:#455f70}
.axis{fill:none;stroke:#466176;stroke-width:2}.guide{fill:none;stroke:#b7cbd9;stroke-width:1.3;stroke-dasharray:6 5}
.graph{fill:none;stroke:#1680a3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:34px;font-weight:750}.section{font-size:27px;font-weight:700}.small{font-size:20px}.micro{font-size:18px}.eq{font-size:24px;font-weight:650}
.pipe{fill:#f4f8fb;stroke:#466176;stroke-width:3}.wick{fill:#8bd0e2;stroke:#167d9c;stroke-width:2}.push{fill:none;stroke:#ac542f;stroke-width:3;stroke-linecap:round}.barAvail{fill:#dcebf5}.segL{fill:#57a8c9}.segV{fill:#8bd0e2}.segG{fill:#d8c9a8}.segM{fill:#b9d9a8}.barCap{fill:#ac542f}.barEv{fill:#57a8c9}.barEn{fill:#d8c9a8}
@media(prefers-color-scheme:dark){.bg{fill:#111b27}.panel{fill:#1e2e3e;stroke:#69869a}.ink{fill:#edf5fc}.muted{fill:#c7d9e6}.axis{stroke:#c0dbea}.guide{stroke:#627c8e}.graph{stroke:#8bdcf4}.pipe{fill:#1e2e3e;stroke:#c0dbea}.wick{fill:#285d74;stroke:#9fdef4}.push{stroke:#ffb38c}.barAvail{fill:#274b63}.segL{fill:#2b6c8c}.segV{fill:#285d74}.segG{fill:#6b5d40}.segM{fill:#476b3a}.barCap{fill:#ffb38c}.barEv{fill:#2b6c8c}.barEn{fill:#6b5d40}}
</style>
<rect class="bg" width="840" height="1280"/>

<text class="title ink" x="30" y="59">§9.11 ヒートパイプ：潜熱の循環と毛管圧力の収支</text>
<text class="small muted" x="30" y="101">蒸発→蒸気の流れ→凝縮→ウィックの毛管還流。ほぼ等温で熱を運ぶ</text>
<rect class="panel" x="23" y="126" width="794" height="477" rx="18"/>
<text class="section ink" x="43" y="169">① 構造：ウィックが液体を蒸発部へ戻す</text>
<rect class="pipe" x="110" y="330" width="620" height="130" rx="60"/>
<rect class="wick" x="110" y="330" width="620" height="26" rx="13"/>
<rect class="wick" x="110" y="434" width="620" height="26" rx="13"/>
<path class="push" d="M220 395 H620 M606 384 L622 395 L606 406"/>
<path class="push" d="M620 343 H240 M254 332 L238 343 L254 354"/>
<text class="small ink" x="150" y="300">蒸発部（熱が入る）</text>
<text class="small ink" x="560" y="300">凝縮部（熱が出る）</text>
<text class="small ink" x="420" y="402" text-anchor="middle">蒸気 →</text>
<text class="small muted" x="420" y="540" text-anchor="middle">← 液体はウィック内を毛管力で還流する</text>
<text class="small muted" x="45" y="584">作動流体は温度範囲・潜熱・表面張力・粘度・材料適合で選ぶ。</text>
<rect class="panel" x="23" y="621" width="794" height="293" rx="18"/>
<text class="section ink" x="43" y="662">② 毛管圧力の収支［Pa］：</text>
<text class="section ink" x="43" y="692">利用可能 4000 = 必要 2800 ＋ 余裕 1200</text>
<rect class="barAvail" x="150" y="706" width="440.0" height="34"/>
<g id="pressure-stack"><rect class="segL" x="150.0" y="760" width="165.0" height="34"/><text class="micro ink" x="232" y="752" text-anchor="middle">液体損失 1500</text><rect class="segV" x="315.0" y="760" width="55.0" height="34"/><text class="micro ink" x="342" y="752" text-anchor="middle">蒸気損失 500</text><rect class="segG" x="370.0" y="760" width="88.0" height="34"/><text class="micro ink" x="440" y="752" text-anchor="middle">重力 800</text><rect class="segM" x="458.0" y="760" width="132.0" height="34"/><text class="micro ink" x="524" y="752" text-anchor="middle">余裕 1200</text></g>
<text class="micro muted" x="43" y="830">Δp_cap ≈ 2σcosθ/r_eff（σ=0.040 N/m、r_eff=20 μm、θ=0）。</text>
<text class="micro muted" x="43" y="860">Q=200 W の潜熱循環は ṁ ≈ 2.0×10^(-4) kg/s（0.20 g/s）。</text>
<text class="micro muted" x="43" y="900">蒸発部が凝縮部より 0.10 m 高い配置の重力項を含む。</text>
<rect class="panel" x="23" y="932" width="794" height="291" rx="18"/>
<text class="section ink" x="43" y="973">③ 輸送限界の候補は別々に評価する（別の輸送区間モデル）</text>
<rect class="barCap" x="200" y="990" width="33.3" height="26"/><text class="small ink" x="50" y="1010">毛管候補</text><text class="small ink" x="243.3" y="1010">≈25.6 W</text><rect class="barEv" x="200" y="1035" width="65.0" height="26"/><text class="small ink" x="50" y="1055">蒸発面候補</text><text class="small ink" x="275.0" y="1055">50.0 W</text><rect class="barEn" x="200" y="1080" width="413.3" height="26"/><text class="small ink" x="50" y="1100">同伴候補</text><text class="small ink" x="623.3" y="1100">≈318 W</text>
<text class="micro muted" x="43" y="1175">最小の候補が毛管限界とは限らない。</text>
<text class="micro muted" x="43" y="1201">性能指数 M=h_fg σ/ν_l ≈ 3.20×10^10 kg/s³ だけでは選定できない。</text>

<text class="micro muted" x="420" y="1255" text-anchor="middle">アプリ作成の独自模式図｜原著図版の転載・トレースなし</text>
</svg>
