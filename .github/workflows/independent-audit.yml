name: Independent learning-content checks
on:
  push:
    branches:
      - 'chatgpt/**'
  pull_request:
    branches:
      - codex/quality-audit-local-pack

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and content tests
        run: npm test
      - name: Audit published material
        run: npm run audit -- --check
      - name: Report factual study coverage
        run: node scripts/coverage-summary.mjs
      - name: Build allowlisted public distribution
        run: npm run build:public

  browser-distribution:
    # Browser tests use the generated public site only. They do not deploy it.
    if: github.event_name == 'pull_request'
    needs: test-and-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Generate exact Pages distribution
        run: npm run build:public
      - name: Browser-test public lesson, quiz, saving, accessibility and offline PDF
        run: node tests/browser-distribution.mjs
